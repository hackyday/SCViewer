    function renderBrowseView(filterType = 'all') {
      const pool = getScopedCatalog().filter(i => !i.comingSoon);
      const filteredPool = filterType === 'all' ? pool : pool.filter(i => i.type === filterType);
      const rows = rowsForTab(filterType);

      if (filteredPool.length === 0 && rows.length === 0) {
        return renderEmptyCatalogState();
      }

      const heroItem = filteredPool.find(i => i.id === state.heroTitleId) || filteredPool[0] || null;

      // Con righe dal bridge (boot/catalog) si renderizzano quelle; senza,
      // l'anteprima browser ricade sulle rail calcolate dal catalogo.
      const rowsHtml = rows.length > 0
        ? rows.map((row, idx) => renderBridgeRow(row, idx)).join('')
        : (() => {
            const continueWatching = filteredPool.filter(i => state.watchProgress[i.id]);
            const top10TV = pool.filter(i => i.type === 'tv' && i.top10Rank).sort((a, b) => a.top10Rank - b.top10Rank);
            const top10Movies = pool.filter(i => i.type === 'movie' && i.top10Rank).sort((a, b) => a.top10Rank - b.top10Rank);
            const originals = filteredPool.filter(i => i.isOriginal);
            return `
              ${renderCarouselRow('row-continue', `Continue Watching for ${state.currentProfile.name}`, continueWatching, { showProgress: true })}
              ${filterType !== 'movie' ? renderCarouselRow('row-top10-tv', 'Top 10 Series Today', top10TV, { isTop10: true }) : ''}
              ${renderCarouselRow('row-all', filterType === 'tv' ? 'All Series' : filterType === 'movie' ? 'All Films' : 'Catalog', filteredPool)}
              ${filterType !== 'tv' ? renderCarouselRow('row-top10-movies', 'Top 10 Films Today', top10Movies, { isTop10: true }) : ''}
              ${renderCarouselRow('row-originals', 'SCtv Originals', originals)}
            `;
          })();

      return `
        ${heroItem ? renderHeroBillboard(heroItem) : ''}
        <div class="-mt-6 relative z-20">
          ${rowsHtml}
        </div>
      `;
    }

    function renderNewAndPopularView() {
      const pool = getScopedCatalog();
      const comingSoon = pool.filter(i => i.comingSoon);
      // Fix TV #9: il Top 10 è ORDINATO per top10Rank (non per ordine catalogo).
      const top10All = pool
        .filter(i => i.top10Rank && !i.comingSoon)
        .sort((a, b) => (a.top10Rank || 0) - (b.top10Rank || 0))
        .slice(0, 10);

      if (comingSoon.length === 0 && top10All.length === 0) {
        return renderEmptyCatalogState('No Upcoming or Trending Titles', 'New releases and popular titles will appear here.');
      }

      return `
        <div class="pt-24 px-6 sm:px-10 max-w-7xl mx-auto">
          <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-8">New & Popular</h1>

          ${comingSoon.length > 0 ? `
            <h2 class="text-lg font-bold uppercase tracking-wider text-zinc-300 mb-4">Coming Soon</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
              ${comingSoon.map(item => {
                const reminded = state.reminders.includes(item.id);
                return `
                  <div class="bg-[#18181B] border border-white/10 rounded-2xl overflow-hidden flex flex-col sm:flex-row shadow-xl">
                    ${item.backdropUrl ? `<img src="${item.backdropUrl}" alt="${item.title}" class="sm:w-56 h-44 sm:h-auto object-cover" />` : ''}
                    <div class="p-5 flex flex-col justify-between flex-1">
                      <div>
                        <div class="text-[11px] font-extrabold uppercase tracking-wider text-amber-400 mb-1">${item.releaseDate || 'Coming Soon'}</div>
                        <h3 class="font-display text-3xl tracking-wide mb-2">${item.title}</h3>
                        <p class="text-xs text-zinc-400 line-clamp-3 mb-4 leading-relaxed">${item.synopsis || ''}</p>
                      </div>
                      <div class="flex items-center gap-3">
                        <button onclick="toggleReminder('${item.id}')"
                          class="tv-focusable px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition ${reminded ? 'bg-emerald-500 text-black' : 'bg-white text-black hover:bg-zinc-200'}">
                          ${reminded ? ICONS.check : ICONS.bell}
                          <span>${reminded ? 'Reminder Set' : 'Remind Me'}</span>
                        </button>
                        <button onclick="openDetailModal('${item.id}')" class="tv-focusable px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold transition">
                          Details
                        </button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}

          ${top10All.length > 0 ? `
            <h2 class="text-lg font-bold uppercase tracking-wider text-zinc-300 mb-4">Top 10 Most Watched</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
              ${top10All.map(item => renderPosterCard(item)).join('')}
            </div>

        </div>
      `;

    function renderMyListView() {
      const pool = getScopedCatalog();
      const saved = pool.filter(i => state.myList.includes(i.id));

      return `
        <div class="pt-24 px-6 sm:px-10 max-w-7xl mx-auto">
          <div class="mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">My List</h1>
            <p class="text-zinc-400 text-sm mt-1">${saved.length} saved title${saved.length === 1 ? '' : 's'} for ${state.currentProfile.name}</p>
          </div>

          ${saved.length === 0 ? `
            <div class="bg-[#18181B] border border-white/10 rounded-2xl p-12 text-center max-w-lg mx-auto my-12">
              <h2 class="text-xl font-bold mb-2">Your watchlist is empty</h2>
              <p class="text-sm text-zinc-400 mb-6">Save series and films to watch later by selecting "+ My List" on any title.</p>
              <button onclick="switchTab('home')" class="tv-focusable px-6 py-3 rounded-xl bg-white text-black font-bold text-sm">
                Explore Catalog
              </button>
            </div>
          ` : `
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
              ${saved.map(item => renderPosterCard(item)).join('')}
            </div>
          `}
        </div>
      `;
    }

    // FIX categorie — i generi NON esistono nelle card della home (solo nel
    // dettaglio): la vecchia vista li derivava da CATALOG e restava senza dati.
    // Ora i generi sono REALI dall'archivio (evento `categories`, metodo
    // bridge loadCategories → /it/archive → props.genres) e la griglia del
    // genere scelto arriva dall'evento `genreData` (loadGenre → filtro
    // genre[] dell'archivio, pagina 1). Token Tailwind per l'evidenza dei
    // chip, applicati via classList (preserva tv-focusable/tv-focused senza
    // ri-renderizzare i chip e senza perdere il fuoco).
    const CHIP_ACTIVE_TOKENS = ['bg-[#E50914]', 'text-white', 'shadow-lg'];
    const CHIP_IDLE_TOKENS = ['bg-white/[0.07]', 'text-zinc-300', 'hover:bg-white/[0.15]', 'hover:text-white'];

    /** Richiesta dei generi reali al bridge (evento `categories` con req). */
    function requestCategories() {
      if (!(Native && Native.loadCategories)) return;
      state.categoriesLoading = true;
      const req = nextReq();
      state.pendingCategoriesReq = req;
      Native.loadCategories(req);
    }

    /** Bottone Riprova nell'empty-state del tab (rete giù / errore archivio). */
    function retryLoadCategories() {
      AudioEngine.playSelect();
      requestCategories();
      renderCurrentView(false);
      // Il bottone cliccato è stato sostituito dallo spinner: il fuoco va sul
      // primo elemento visibile della vista (o resta dove è se non c'è nulla).
      const firstInView = focusableList.find(el => el.closest('#view-container'));
      if (firstInView) setTVFocus(firstInView);
    }

    /** Griglia dei titoli del tab Categorie (genere "All" = prime 60 del
     *  archivio, altrimenti titoli del genere scelto). Sostituita MIRATAMENTE
     *  da `genreData` — i chip e il fuoco non vengono toccati. */
    function renderCategoriesGridInner() {
      if (state.genreLoading) {
        return `
          <div class="flex items-center gap-4 justify-center py-10">
            <div class="w-8 h-8 rounded-full border-4 border-white/15 border-t-[#E50914] animate-spin shrink-0"></div>
            <p class="text-sm text-zinc-400">Caricamento genere…</p>
          </div>`;
      }
      const items = state.genreIds
        .map(id => CATALOG.find(c => c.id === id))
        .filter(Boolean);
      if (items.length === 0) {
        return `
          <div class="bg-[#18181B] rounded-2xl p-10 text-center border border-white/10">
            <p class="text-lg font-bold mb-1">Nessun titolo in questo genere</p>
            <p class="text-sm text-zinc-400">Scegli un altro genere dall'archivio.</p>
          </div>`;
      }
      return `
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
          ${items.map(item => renderPosterCard(item)).join('')}
        </div>`;
    }

    /** Aggiornamento MIRATO della sola griglia categorie (evento `genreData`
     *  o cambio chip): mai renderCurrentView integrale — il fuoco resta dove
     *  è (sui chip o sulla card già in fuoco). */
    function updateCategoriesGrid() {
      const wrap = document.getElementById('categories-grid-wrap');
      if (wrap) wrap.innerHTML = renderCategoriesGridInner();
      refreshFocusableElements();
    }

    /** Evidenza del chip selezionato senza ricreare i nodi: i token attivi/
     *  inattivi si scambiano via classList (tv-focusable/tv-focused restano). */
    function syncCategoryChipHighlight() {
      const box = document.getElementById('categories-chips');
      if (!box) return;
      box.querySelectorAll('button[data-genre-id]').forEach(btn => {
        const active = btn.dataset.genreId === String(state.selectedGenreId);
        CHIP_ACTIVE_TOKENS.forEach(t => btn.classList.toggle(t, active));
        CHIP_IDLE_TOKENS.forEach(t => btn.classList.toggle(t, !active));
      });
    }

    function renderCategoriesView() {
      // Caricamento generi in corso (loadCategories): spinner a vista intera.
      if (state.categoriesLoading) {
        return `
          <div class="fixed inset-0 flex flex-col items-center justify-center">
            <div class="w-10 h-10 rounded-full border-4 border-white/15 border-t-[#E50914] animate-spin"></div>
            <p class="mt-4 text-sm text-zinc-400">Caricamento categorie…</p>
          </div>`;
      }
      // Generi mai arrivati (errore o anteprima browser): empty-state con
      // Riprova — niente generi finti derivati dal catalogo.
      if (!Array.isArray(state.categoriesGenres)) {
        return `
          <div class="pt-24 px-6 sm:px-10 max-w-2xl mx-auto text-center">
            <div class="bg-[#18181B] border border-white/10 rounded-2xl p-12 shadow-xl">
              <h2 class="text-2xl font-bold mb-2">Categorie non disponibili</h2>
              <p class="text-sm text-zinc-400 mb-6">I generi dell'archivio non sono arrivati. Controlla la rete e Riprova.</p>
              <button onclick="retryLoadCategories()" class="tv-focusable px-6 py-3 rounded-xl bg-[#E50914] hover:bg-[#FF1E27] text-white font-bold text-sm">Riprova</button>
            </div>
          </div>`;
      }

      // Chips REALI: All + i 26 generi dell'archivio (id/name da props.genres).
      // Il click passa l'id numerico (mai il nome: gli attributi onclick non
      // devono contenere testo del sito).
      const chips = [{ id: 'all', name: 'All' }].concat(state.categoriesGenres);
      return `
        <div class="pt-24 px-6 sm:px-10 max-w-7xl mx-auto">
          <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-6">Categories</h1>

          <div id="categories-chips" class="flex flex-wrap gap-2.5 mb-8">
            ${chips.map(g => `
              <button data-genre-id="${g.id}" onclick="selectCategory('${g.id}')"
                class="tv-focusable px-5 py-2.5 rounded-lg text-xs uppercase tracking-wider font-bold transition ${String(state.selectedGenreId) === String(g.id) ? 'bg-[#E50914] text-white shadow-lg' : 'bg-white/[0.07] text-zinc-300 hover:bg-white/[0.15] hover:text-white'}">
                ${g.name}
              </button>
            `).join('')}
          </div>

          <div id="categories-grid-wrap">${renderCategoriesGridInner()}</div>
        </div>
      `;
    }

    /** Click su un chip genere: "All" usa la griglia già in cache (prime 60),
     *  un genere reale parte con loadGenre → `genreData` aggiorna SOLO la
     *  griglia. Il fuoco resta sul chip cliccato. */
    function selectCategory(genreId) {
      AudioEngine.playSelect();
      if (String(genreId) === 'all') {
        state.selectedGenreId = 'all';
        state.genreIds = state.categoriesIds;
        state.genreLoading = false;
        state.pendingGenreReq = null;
        syncCategoryChipHighlight();
        updateCategoriesGrid();
        return;
      }
      if (!(Native && Native.loadGenre)) return;
      state.selectedGenreId = String(genreId);
      state.genreLoading = true;
      const req = nextReq();
      state.pendingGenreReq = req;
      syncCategoryChipHighlight();
      updateCategoriesGrid();
      Native.loadGenre(parseInt(genreId, 10), req);
    }

    /**
     * 9. TV ON-SCREEN KEYBOARD SEARCH VIEW
     */
    function searchPool() {
      const pool = getScopedCatalog();
      const q = state.searchQuery.trim().toLowerCase();
      return q
        ? pool.filter(i =>
            i.title.toLowerCase().includes(q) ||
            (i.genres || []).some(g => g.toLowerCase().includes(q)) ||
            (i.cast || []).some(c => c.toLowerCase().includes(q))
          )
        : pool.slice(0, 10);
    }

    /** Blocco destro del tab search (heading + griglia/empty): viene
     *  sostituito MIRATAMENTE ad ogni tasto (fix TV #14). Con risultati
     *  remoti per la query corrente si mostrano quelli (match del server,
     *  pertinenza su cast/plot), altrimenti il filtro locale sul catalogo. */
    function renderSearchResultsInner() {
      const q = state.searchQuery.trim();
      const remote = state.remoteResults;
      const results = (remote && remote.query === state.searchQuery)
        ? remote.ids.map(id => CATALOG.find(c => c.id === id)).filter(Boolean)
        : searchPool();

      // Attesa della risposta server (debounce scattato, Native.search in
      // volo): spinner dedicato al posto della griglia.
      if (state.searchPending) {
        return `
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold tracking-tight">Results for "${state.searchQuery}"</h2>
          </div>
          <div class="bg-[#18181B] rounded-2xl p-10 border border-white/10 flex items-center gap-4">
            <div class="w-8 h-8 rounded-full border-4 border-white/15 border-t-[#E50914] animate-spin shrink-0"></div>
            <p class="text-sm text-zinc-400">Ricerca in corso…</p>
          </div>
        `;
      }

      return `
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold tracking-tight">
            ${q ? `Results for "${state.searchQuery}" (${results.length})` : 'Browse Catalog'}
          </h2>
        </div>

        ${results.length === 0 ? `
          <div class="bg-[#18181B] rounded-2xl p-10 text-center border border-white/10">
            <p class="text-lg font-bold mb-1">${q ? `No matches found for "${state.searchQuery}"` : 'Catalog is empty'}</p>
            <p class="text-sm text-zinc-400">${q ? 'Try searching for another title, cast member, or genre.' : 'Add items to the catalog to enable search.'}</p>
          </div>
        ` : `
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            ${results.map(item => renderPosterCard(item)).join('')}
          </div>
        `}
      `;
    }

    function renderSearchView() {
      const keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');

      return `
        <div class="pt-24 px-6 sm:px-10 max-w-7xl mx-auto">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <div class="lg:col-span-5 bg-[#18181B] border border-white/10 rounded-2xl p-5 h-fit">
              <div class="flex items-center gap-3 bg-black/75 border border-white/15 rounded-xl px-4 py-3 mb-4">
                <svg class="w-5 h-5 text-zinc-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="tv-search-input" type="text" value="${state.searchQuery}"
                  oninput="handleSearchInput(this.value)"

                <button id="search-clear-btn" onclick="clearSearchQuery()"

              </div>

              <div class="grid grid-cols-3 gap-2 mb-2.5">

                <button onclick="backspaceSearchChar()" class="tv-focusable py-2.5 rounded-lg bg-white/[0.08] hover:bg-white/[0.18] text-xs font-bold uppercase tracking-wider transition">Delete</button>

              </div>

              <div class="grid grid-cols-6 gap-1.5">
                ${keys.map(k => `
                  <button onclick="appendSearchChar('${k}')"

    // Fix TV #14: aggiornamento MIRATO (input + griglia) — MAI
    // renderCurrentView integrale per tasto (il fuoco resta sul tasto).
    function updateSearchView() {
      const inp = document.getElementById('tv-search-input');
      if (inp && inp.value !== state.searchQuery) inp.value = state.searchQuery;
      const clearBtn = document.getElementById('search-clear-btn');
      if (clearBtn) clearBtn.classList.toggle('hidden', !state.searchQuery);
      const wrap = document.getElementById('search-results-wrap');
      if (wrap) wrap.innerHTML = renderSearchResultsInner();
    }

    function appendSearchChar(ch) {
      AudioEngine.playTick(600);
      state.searchQuery += ch;
      updateSearchView();
      scheduleRemoteSearch();
    }
    function backspaceSearchChar() {
      AudioEngine.playTick(420);
      state.searchQuery = state.searchQuery.slice(0, -1);
      updateSearchView();
      scheduleRemoteSearch();
    }
    function clearSearchQuery() {
      AudioEngine.playSelect();
      // Reset annulla l'attesa PRIMA del re-render: la griglia non deve mai
      // rimanere inchiodata sullo stato "Ricerca in corso…".
      cancelRemoteSearch();
      state.searchQuery = '';
      updateSearchView();
    }
    // Typing reale (IME/desktop): solo griglia, niente render integrale né
    // rubafuoco — l'input conserva il suo focus.
    function handleSearchInput(val) {
      state.searchQuery = val;
      updateSearchView();
      scheduleRemoteSearch();
    }

    /** Ricerca SERVER (M2): la tastiera a schermo genera una lettera per
     *  pressione — la query va al bridge con debounce (650ms, min 2 caratteri)
     *  per non martellare il sito; la risposta (`searchResults`) aggiorna la
     *  griglia in modo mirato. Filtri e griglia restano reattivi in locale.
     *  Dal debounce allo scatto si marca searchPending: la griglia mostra
     *  "Ricerca in corso…" durante l'attesa (aggiornamento mirato). */
    let searchTimer = null;
    function scheduleRemoteSearch() {
      clearTimeout(searchTimer);
      state.remoteResults = null;
      const q = state.searchQuery.trim();
      if (q.length < 2 || !(Native && Native.search)) {
        // Query sotto soglia o senza bridge: nessuna ricerca in volo — se un
        // attesa precedente era segnata va rimossa (grid re-render mirato).
        if (state.searchPending || state.pendingSearchReq != null) {
          state.searchPending = false;
          state.pendingSearchReq = null;
          updateSearchView();
        }
        return;
      }
      searchTimer = setTimeout(() => {
        const req = nextReq();
        state.searchPending = true;
        state.pendingSearchReq = req;
        updateSearchView();
        Native.search(q, req);
      }, 650);
    }
    function cancelRemoteSearch() {
      clearTimeout(searchTimer);
      state.remoteResults = null;
      state.searchPending = false;
      state.pendingSearchReq = null;
    }

    function checkConnectionStatus() {
      AudioEngine.playSelect();
      const online = navigator.onLine;
      const lbl = document.getElementById('network-status-label');
      if (lbl) {
        lbl.textContent = online ? 'Online' : 'Offline';
        lbl.className = online ? 'text-emerald-400' : 'text-red-400';
      }
      showToast(online ? 'Device is online' : 'Device is offline');
    }

    function renderCurrentView(focusFirst = true) {
      const container = document.getElementById('view-container');
      // Fix TV #12: finché il boot non è arrivato, spinner — mai il flash
      // "No Titles Available".
      if (!bootReceived) {
        showViewLoading();
        return;
      }
      switch (state.activeTab) {
        case 'home':
          container.innerHTML = renderBrowseView('all');
          break;
        case 'tv':
          container.innerHTML = renderBrowseView('tv');
          break;
        case 'movies':
          container.innerHTML = renderBrowseView('movie');
          break;
        case 'new':
          container.innerHTML = renderNewAndPopularView();
          break;
        case 'mylist':
          container.innerHTML = renderMyListView();
          break;
        case 'categories':
          container.innerHTML = renderCategoriesView();
          break;
        case 'search':
          container.innerHTML = renderSearchView();
          break;
        case 'settings':
          container.innerHTML = renderSettingsView();
          break;

      if (focusFirst) setTVFocus(focusableList[0]);

    /**
     * 11. MY LIST, RATINGS & REMINDERS
     */
    function toggleMyList(titleId) {
      AudioEngine.playSelect();
      const idx = state.myList.indexOf(titleId);
      const item = getTitleById(titleId);
      if (!item) return;
      if (idx >= 0) {
        state.myList.splice(idx, 1);
        showToast(`Removed "${item.title}" from My List`);
      } else {
        state.myList.push(titleId);
        showToast(`Added "${item.title}" to My List`);
      }
      renderCurrentView();
      if (state.detailModalTitleId === titleId) renderDetailModalContent();
      // Bridge: FavoritesStore reale (M2). L'aggiornamento ottimistico sopra
      // rende la UI immediata anche se il nativo non risponde.
      if (Native && Native.toggleMyList) Native.toggleMyList(numericTitleId(item));
    }

    function setRating(titleId, ratingVal) {
      AudioEngine.playSelect();
      if (state.ratings[titleId] === ratingVal) {
        delete state.ratings[titleId];
        showToast('Rating removed');
      } else {
        state.ratings[titleId] = ratingVal;
        const labels = { down: 'Marked as not for me', up: 'Rated: Liked', love: 'Rated: Loved' };
        showToast(labels[ratingVal]);
      }
      if (state.detailModalTitleId === titleId) renderDetailModalContent();
      // Rating PER-PROFILO (localStorage con suffisso profilo).
      persistRatings();
    }

    function toggleReminder(titleId) {
      AudioEngine.playSelect();
      const idx = state.reminders.indexOf(titleId);
      const item = getTitleById(titleId);
      if (!item) return;
      if (idx >= 0) {
        state.reminders.splice(idx, 1);
        showToast(`Reminder removed for ${item.title}`);
      } else {
        state.reminders.push(titleId);
        showToast(`Reminder set for ${item.title}`);
      }
      renderCurrentView();
      // Reminder PER-PROFILO (localStorage con suffisso profilo).
      persistReminders();
    }

     * 12. TITLE DETAIL MODAL

    function openDetailModal(titleId) {
      const item = getTitleById(titleId);
      if (!item) return;
      AudioEngine.playSelect();
      state.detailModalTitleId = titleId;
      state.detailSelectedSeason = item.currentSeason || 1;
      state.seasonLoading = false;
      pendingSeason = null;
      // M2: gli item degli slider sono "lean" (senza genres/cast/episodi):
      // il dettaglio reale arriva SEMPRE via bridge (LRU nativo = risposta
      // immediata sui titoli già visti) e sostituisce l'item al ricevimento.
      pendingDetail = null;
      if (Native && Native.loadDetail) {
        const req = nextReq();
        pendingDetail = { titleId: item.id, req };
        Native.loadDetail(numericTitleId(item), req);
      }
      renderDetailModalContent();

      const modal = document.getElementById('detail-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      refreshFocusableElements();
      setTVFocus(focusableList[0]);
    }

    function closeDetailModal() {
      AudioEngine.playTick(400);
      state.detailModalTitleId = null;
      pendingDetail = null;
      pendingSeason = null;
      state.seasonLoading = false;
      const modal = document.getElementById('detail-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      refreshFocusableElements();
      // Fix TV #6: al rientro dalla modal il fuoco torna sul primo elemento
      // della vista sottostante.
      setTVFocus(focusableList[0]);

                <button onclick="setRating('${item.id}', 'down')" class="tv-focusable p-2.5 rounded-lg transition ${rating === 'down' ? 'bg-white text-black' : 'text-zinc-300 hover:bg-white/15'}" title="Not for me">${ICONS.thumbDown}</button>
                <button onclick="setRating('${item.id}', 'up')" class="tv-focusable p-2.5 rounded-lg transition ${rating === 'up' ? 'bg-white text-black' : 'text-zinc-300 hover:bg-white/15'}" title="I like this">${ICONS.thumbUp}</button>
                <button onclick="setRating('${item.id}', 'love')" class="tv-focusable p-2.5 rounded-lg transition ${rating === 'love' ? 'bg-[#E50914] text-white' : 'text-zinc-300 hover:bg-white/15'}" title="Love this">${ICONS.heart}</button>
              </div>
            </div>
          </div>
        </div>

        <div class="px-6 sm:px-10 pb-10">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2">
              <div class="flex flex-wrap items-center gap-2.5 text-sm font-semibold mb-3">
                ${item.match ? `<span class="text-emerald-400 font-bold">${item.match}% Match</span>` : ''}
                ${item.year ? `<span>${item.year}</span>` : ''}
                ${item.maturity ? `<span class="border border-zinc-600 px-1.5 py-0.5 rounded text-xs">${item.maturity}</span>` : ''}
                ${item.durationLabel ? `<span>${item.durationLabel}</span>` : ''}
                ${(item.badges || []).map(b => `<span class="bg-white/10 px-2 py-0.5 rounded text-xs text-zinc-300">${b}</span>`).join('')}
              </div>
              <p class="text-zinc-300 text-sm sm:text-base leading-relaxed">${item.synopsis || ''}</p>
            </div>

            <div class="text-xs sm:text-sm space-y-2 text-zinc-300">
              ${item.cast && item.cast.length ? `<div><span class="text-zinc-500">Cast:</span> ${item.cast.join(', ')}</div>` : ''}
              ${item.genres && item.genres.length ? `<div><span class="text-zinc-500">Genres:</span> ${item.genres.join(', ')}</div>` : ''}
              ${item.creator ? `<div><span class="text-zinc-500">Creator:</span> ${item.creator}</div>` : ''}
            </div>
          </div>

          ${episodesSection}

          ${similar.length > 0 ? `
            <div class="mt-8 border-t border-white/10 pt-6">
              <h3 class="text-lg font-bold uppercase tracking-wider text-zinc-200 mb-4">More Like This</h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                ${similar.map(sim => `
                  <div onclick="openDetailModal('${sim.id}')" class="tv-focusable bg-[#222226] rounded-xl overflow-hidden cursor-pointer border border-white/10 hover:border-white/30 transition">
                    ${sim.backdropUrl ? `<img src="${sim.backdropUrl}" alt="${sim.title}" class="w-full h-28 object-cover" />` : ''}
                    <div class="p-3.5">
                      <div class="flex items-center justify-between text-xs mb-1">
                        ${sim.match ? `<span class="text-emerald-400 font-bold">${sim.match}% Match</span>` : '<span></span>'}
                        ${sim.maturity ? `<span class="border border-zinc-600 px-1 rounded text-[10px]">${sim.maturity}</span>` : ''}
                      </div>
                      <div class="font-bold text-sm truncate mb-1">${sim.title}</div>
                      <p class="text-xs text-zinc-400 line-clamp-2">${sim.synopsis || ''}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // Fix TV #4: il selettore stagione è una coppia di bottoni ◀/▶.
    function changeDetailSeason(n) {
      const item = getTitleById(state.detailModalTitleId);
      if (!item) return;
      const max = (item && item.seasons) || 1;
      const next = Math.min(max, Math.max(1, parseInt(n, 10) || 1));
      if (next === state.detailSelectedSeason) return;
      AudioEngine.playTick();
      state.detailSelectedSeason = next;
      // Stagione già in cache locale → filtro diretto; altrimenti partial
      // reload via bridge (titleSeason → re-render) con spinner di attesa.
      const cached = (item.episodes || []).some(ep => (ep.season || 1) === next);
      if (Native && Native.loadDetailSeason && !cached) {
        state.seasonLoading = true;
        const req = nextReq();
        pendingSeason = { titleId: item.id, req };
        Native.loadDetailSeason(numericTitleId(item), next, req);
      } else {
        state.seasonLoading = false;
      }
      renderDetailModalContent();
      // Riporta il fuoco sul selettore stagione (restare in pagina invece di
      // saltare al primo elemento del modal dopo ogni ◀/▶).
      refreshFocusableElements();
      const prev = document.getElementById('season-prev');
      setTVFocus(prev && focusableList.includes(prev) ? prev : focusableList[0]);
    }

    /**
     * 13. PLAYBACK — delegato al player NATIVO
     */
    // Fix TV #3/#7: niente player HTML5; startPlayback passa dal bridge e
    // azzera il fuoco corrente (la WebView va in onPause: un anello
    // congelato su video nativo sembrerebbe un bug).
    function startPlayback(titleId, season = null, episode = null) {
      const item = getTitleById(titleId);
      if (!item) return;

      AudioEngine.playSelect();
      if (state.detailModalTitleId) closeDetailModal();

      if (currentFocusedEl) {
        currentFocusedEl.classList.remove('tv-focused');
        currentFocusedEl = null;
      }

      // Il bridge vuole l'id NUMERICO del titolo ("site-123" → 123): passare
      // la stringa dell'id item produrrebbe una conversione fallita (0).
      // Chiamata senza stagione/episodio espliciti (card, hero): se il titolo
      // è in "Continua a guardare" si riprende la puntata salvata, altrimenti
      // S1E1 (per i film i due valori sono irrilevanti).
      const wp = state.watchProgress[item.id];
      const s = season || (wp && wp.season) || 1;
      const e = episode || (wp && wp.episode) || 1;

      if (Native && Native.play) {
        Native.play(numericTitleId(item), s, e);
      } else {
        showToast('Playback requires the native app (browser preview only)');
      }
    }

    /**
     * 14. SMART TV SPATIAL D-PAD NAVIGATION & VIRTUAL REMOTE
     */
    let focusableList = [];
    let currentFocusedEl = null;

    function refreshFocusableElements() {
      let root = document;
      // Fix TV #3: il root del player overlay non esiste più — l'ordine di
      // precedenza resta modal dettaglio > modal profilo > gate > shell.
      if (!document.getElementById('detail-modal').classList.contains('hidden')) {
        root = document.getElementById('detail-modal');
      } else if (!document.getElementById('profile-editor-modal').classList.contains('hidden')) {
        root = document.getElementById('profile-editor-modal');
      } else if (!document.getElementById('profile-screen').classList.contains('hidden')) {
        root = document.getElementById('profile-screen');
      } else {
        root = document.getElementById('tv-app-shell');
      }

      focusableList = Array.from(root.querySelectorAll('.tv-focusable')).filter(el => {
        const rect = el.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0;
      });
    }

    function setTVFocus(el) {
      if (!el) return;
      if (currentFocusedEl) {
        currentFocusedEl.classList.remove('tv-focused');
      }
      currentFocusedEl = el;
      el.classList.add('tv-focused');

      const isInSidebar = Boolean(el.closest('#tv-sidebar'));
      expandSidebar(isInSidebar);

      el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      // Fix modal (verifica logica): lo scrollIntoView smooth può essere un
      // no-op su WebView TV (animazioni di sistema disattivate) e lasciare
      // fuori vista gli elementi in fondo dei contenitori overflow-y (modal
      // profili/dettaglio, gate). Aggiustamento verticale ISTANTANEO garantito,
      // solo se l'elemento è fuori vista: le rail orizzontali (overflow-y senza
      // overflow reale) continuano a scorrere smooth come prima.
      ensureVerticalInView(el);
      AudioEngine.playTick();
    }

    /** Porta el interamente dentro l'area visibile di ogni antenato con
     *  overflow-y auto/scroll (margini 4px per il ring di fuoco). */
    function ensureVerticalInView(el) {
      let node = el.parentElement;
      while (node && node !== document.documentElement) {
        if (node.scrollHeight > node.clientHeight) {
          const cs = window.getComputedStyle(node);
          if (cs.overflowY === 'auto' || cs.overflowY === 'scroll') {
            const box = node.getBoundingClientRect();
            const r = el.getBoundingClientRect();
            if (r.top < box.top + 4) {
              node.scrollTop += r.top - box.top - 4;
            } else if (r.bottom > box.bottom - 4) {
              node.scrollTop += r.bottom - box.bottom + 4;
            }
          }
        }
        node = node.parentElement;
      }
    }

    function moveSpatialFocus(direction) {
      refreshFocusableElements();
      if (focusableList.length === 0) return;

      if (!currentFocusedEl || !focusableList.includes(currentFocusedEl)) {
        setTVFocus(focusableList[0]);
        return;
      }

      const currInSidebar = Boolean(currentFocusedEl.closest('#tv-sidebar'));
      const currRect = currentFocusedEl.getBoundingClientRect();
      const cx = currRect.left + currRect.width / 2;
      const cy = currRect.top + currRect.height / 2;

      let bestCandidate = null;
      let bestScore = Infinity;

      for (const cand of focusableList) {
        if (cand === currentFocusedEl) continue;
        const candInSidebar = Boolean(cand.closest('#tv-sidebar'));

        if (currInSidebar && direction === 'right' && candInSidebar) continue;
        if (currInSidebar && (direction === 'up' || direction === 'down') && !candInSidebar) continue;

        const r = cand.getBoundingClientRect();
        const tx = r.left + r.width / 2;
        const ty = r.top + r.height / 2;
        const dx = tx - cx;
        const dy = ty - cy;

        let valid = false;
        let primaryDist = 0;
        let orthoDist = 0;

        if (direction === 'right' && dx > 12) {
          valid = true; primaryDist = dx; orthoDist = Math.abs(dy);
        } else if (direction === 'left' && dx < -12) {
          valid = true; primaryDist = -dx; orthoDist = Math.abs(dy);
        } else if (direction === 'down' && dy > 12) {
          valid = true; primaryDist = dy; orthoDist = Math.abs(dx);
        } else if (direction === 'up' && dy < -12) {
          valid = true; primaryDist = -dy; orthoDist = Math.abs(dx);
        }

        if (valid) {
          const score = primaryDist + orthoDist * 2.6;
          if (score < bestScore) {
            bestScore = score;
            bestCandidate = cand;
          }
        }
      }

      if (bestCandidate) {
        setTVFocus(bestCandidate);
      }
    }

    function toggleVirtualRemote() {
      AudioEngine.playSelect();
      state.virtualRemoteOpen = !state.virtualRemoteOpen;
      const panel = document.getElementById('virtual-remote-panel');
      if (state.virtualRemoteOpen) panel.classList.remove('hidden');
      else panel.classList.add('hidden');
    }

    function handleRemoteAction(action) {
      if (action === 'up' || action === 'down' || action === 'left' || action === 'right') {
        moveSpatialFocus(action);
      } else if (action === 'ok') {
        if (currentFocusedEl) currentFocusedEl.click();
      } else if (action === 'back') {
        // Su TV il BACK nativo passa da window.__sctvBackState (che qui
        // richiama handleBackNavigation e decide stay/exit); questo ramo
        // serve al remote virtuale dell'anteprima browser.
        handleBackNavigation();
      } else if (action === 'home') {
        if (state.detailModalTitleId) closeDetailModal();
        if (state.currentProfile) switchTab('home');
      }
    }

    function handleBackNavigation() {
      if (!document.getElementById('detail-modal').classList.contains('hidden')) {
        closeDetailModal();
      } else if (!document.getElementById('profile-editor-modal').classList.contains('hidden')) {
        closeProfileEditor();
      } else if (state.currentProfile && state.activeTab !== 'home') {
        switchTab('home');
      } else if (state.currentProfile) {
        openProfileGate();
      }
    }

    document.addEventListener('keydown', (e) => {
      const activeTag = document.activeElement ? document.activeElement.tagName : '';
      const isTyping = activeTag === 'INPUT' || activeTag === 'SELECT';

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        moveSpatialFocus('up');
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        moveSpatialFocus('down');
      } else if (e.key === 'ArrowLeft' && !isTyping) {
        e.preventDefault();
        moveSpatialFocus('left');
      } else if (e.key === 'ArrowRight' && !isTyping) {
        e.preventDefault();
        moveSpatialFocus('right');
      } else if (e.key === 'Enter' && !isTyping) {
        if (currentFocusedEl) {
          e.preventDefault();
          currentFocusedEl.click();
        }
      } else if (e.key === 'Escape' || (e.key === 'Backspace' && !isTyping)) {
        e.preventDefault();
        handleBackNavigation();
      }
    });

    // Fix TV #1: l'handler mousemove che cancellava il fuoco è RIMOSSO —
    // su TV arrivano mousemove sintetici che rendevano il D-pad "morto".

    /**
     * 15. INITIALIZATION ON WINDOW LOAD
     */
    window.onload = function () {
      // Fix TV #11: profili da localStorage con default "Predefinito".
      state.profiles = loadProfiles();
      updateClock();
      syncAudioIcons();
      renderProfileKeyboard();
      renderProfilesGrid();

      // Fix TV #8: il remote virtuale esiste solo SENZA bridge nativo.
      if (!Native) {
        const remoteRoot = document.getElementById('virtual-remote-root');
        if (remoteRoot) remoteRoot.classList.remove('hidden');
      }

      bootReady();

      setTimeout(() => {
        const splash = document.getElementById('boot-splash');
        splash.classList.add('opacity-0');
        setTimeout(() => {
          splash.classList.add('hidden');
          const profScreen = document.getElementById('profile-screen');
          profScreen.classList.remove('hidden');
          profScreen.classList.add('flex');
          refreshFocusableElements();
          // Fix TV #6: primo profilo già in fuoco al gate.
          setTVFocus(focusableList[0]);
        }, 500);
      }, 1350);
    };
  </script>
</body>
