<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <!--
    SCtv — interfaccia TV (asset locale, offline).
    Sorgente normativo: docs/sctv/sctv-interface.html, adattato per TV con i
    fix obbligatori del piano §4 (M1). CSS Tailwind COMPILATO (sctv.css) +
    font WOFF2 locali: rigenerare con tools/build-sctv.sh, MAI riportare il
    CDN runtime (offline = interfaccia spogliata).
  -->
  <meta charset="UTF-8" />
  <!-- Fix TV #10: layout fisso 1280 (lo stick ha viewport ~960 CSS px, la
       WebView nativa forza useWideViewPort + textZoom 100). -->
  <meta name="viewport" content="width=1280" />
  <title>SCtv</title>
  <link rel="stylesheet" href="sctv.css" />

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0E0E10;
      color: #F4F4F5;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .tv-focusable {
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.24s ease,
                  border-color 0.24s ease,
                  background-color 0.2s ease;
    }

    .tv-focused {
      outline: none;
      transform: scale(1.05);
      box-shadow: 0 0 0 2.5px #FFFFFF, 0 20px 44px rgba(0, 0, 0, 0.9);
      z-index: 30;
    }

    #tv-sidebar.sidebar-expanded {
      width: 16rem;
      box-shadow: 16px 0 48px rgba(0, 0, 0, 0.85);
    }
    #tv-sidebar.sidebar-expanded .sidebar-label {
      opacity: 1;
    }

    .hero-vignette-left {
      background: linear-gradient(90deg, #0E0E10 0%, rgba(14, 14, 16, 0.94) 30%, rgba(14, 14, 16, 0.45) 64%, rgba(14, 14, 16, 0.05) 100%);
    }
    .hero-vignette-bottom {
      background: linear-gradient(0deg, #0E0E10 0%, rgba(14, 14, 16, 0.88) 20%, rgba(14, 14, 16, 0) 100%);
    }

    @keyframes sctvIntro {
      0% { transform: scale(0.88); opacity: 0; letter-spacing: 0.32em; }
      40% { transform: scale(1); opacity: 1; letter-spacing: 0.1em; }
      85% { transform: scale(1.03); opacity: 1; letter-spacing: 0.12em; }
      100% { transform: scale(1.18); opacity: 0; letter-spacing: 0.18em; }
    }
    .animate-sctv-intro {
      animation: sctvIntro 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes kenBurns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.05) translate(-0.8%, -0.8%); }
      100% { transform: scale(1) translate(0, 0); }
    }
    .animate-ken-burns {
      animation: kenBurns 24s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#0E0E10] text-zinc-100 antialiased selection:bg-[#E50914] selection:text-white">

  <!-- ==================== 1. BOOT SPLASH SCREEN ==================== -->
  <div id="boot-splash" class="fixed inset-0 z-[100] bg-[#050507] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="animate-sctv-intro flex flex-col items-center">
      <div class="flex items-baseline gap-1">
        <span class="font-display text-7xl sm:text-9xl text-[#E50914] tracking-wider drop-shadow-[0_0_40px_rgba(229,9,20,0.55)]">SC</span>
        <span class="font-sans text-4xl sm:text-6xl font-extrabold text-white tracking-tight">tv</span>
      </div>
      <div class="w-24 h-0.5 bg-gradient-to-r from-transparent via-[#E50914] to-transparent mt-3"></div>
    </div>
  </div>

  <!-- ==================== 2. WHO'S WATCHING (PROFILE GATE) ==================== -->
  <div id="profile-screen" class="fixed inset-0 z-50 bg-[#0E0E10] hidden flex-col items-center justify-center px-6 py-10 overflow-y-auto">
    <div class="absolute top-7 left-8 sm:left-12 flex items-center gap-3">
      <div class="flex items-baseline">
        <span class="font-display text-3xl sm:text-4xl text-[#E50914] tracking-wider">SC</span>
        <span class="font-sans text-xl sm:text-2xl font-extrabold text-white tracking-tight">tv</span>
      </div>
    </div>

    <div class="absolute top-7 right-8 sm:right-12 flex items-center gap-3">
      <!-- Fix TV #5: raggiungibile col D-pad. -->
      <button id="sound-toggle-profile" onclick="toggleSound()" class="px-4 py-2 rounded-lg bg-white/[0.06] hover:bg-white/[0.12] border border-white/10 text-xs font-semibold flex items-center gap-2 text-zinc-300 transition">
        <span id="sound-icon-profile" class="w-4 h-4 flex items-center justify-center"></span>
        <span id="sound-label-profile">UI Audio: On</span>
      </button>
    </div>

    <div class="max-w-5xl w-full text-center my-auto">
      <h1 id="profile-heading" class="text-3xl sm:text-5xl font-bold tracking-tight text-white mb-3">Who's watching?</h1>
      <p id="profile-subheading" class="text-zinc-400 text-sm mb-12">Select or create a profile to continue</p>

      <div id="profiles-grid" class="flex flex-wrap items-center justify-center gap-6 sm:gap-10 mb-14"></div>

      <div class="flex flex-wrap items-center justify-center gap-4">
        <button id="manage-profiles-btn" onclick="toggleManageProfiles()" class="tv-focusable hidden px-8 py-3 rounded-lg border border-zinc-700 text-zinc-300 hover:text-white hover:border-white font-semibold tracking-wider uppercase text-xs transition">
          Manage Profiles
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 3. ADD / EDIT PROFILE MODAL ==================== -->
  <!-- Fix TV #2: TUTTI i controlli sono tv-focusable e il nome si scrive con
       la mini-tastiera a schermo (l'IME di sistema su TV è inaffidabile). -->
  <div id="profile-editor-modal" class="fixed inset-0 z-[60] bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
    <!-- Fix altezze piccole (stick ~540px visibili): come #detail-modal-card il
         contenuto ha max-h + overflow-y-auto (no-scrollbar) e le spaziature
         sono compatte nella variante base — il fondo della card (Salvare/
         Eliminare) resta raggiungibile col D-pad e, se serve, scrollIntoView
         di setTVFocus porta gli elementi in fondo a visibilità. -->
    <div class="bg-[#18181B] border border-white/10 rounded-2xl max-w-md w-full max-h-[92vh] overflow-y-auto no-scrollbar p-5 sm:p-6 shadow-2xl">
      <h2 id="profile-editor-title" class="text-xl sm:text-2xl font-bold mb-1">Add Profile</h2>
      <p class="text-xs sm:text-sm text-zinc-400 mb-3 sm:mb-5">Create a dedicated profile with personalized watchlists.</p>

      <div class="space-y-3 sm:space-y-5">
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 font-semibold mb-1.5 sm:mb-2">Profile Name</label>
          <input id="profile-name-input" type="text" maxlength="18" readonly placeholder="Use the on-screen keyboard" class="w-full bg-[#222226] border border-white/10 rounded-xl px-4 py-2.5 sm:py-3 text-white text-sm font-medium focus:outline-none focus:border-white transition" />
          <div id="profile-kbd" class="mt-2 sm:mt-3"></div>
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 font-semibold mb-1.5 sm:mb-2">Avatar Style</label>
          <div id="avatar-color-picker" class="grid grid-cols-5 gap-3"></div>
        </div>

        <!-- Fix TV #2: era una <label> con checkbox (inaccessible al D-pad). -->
        <button type="button" id="profile-kids-toggle" onclick="toggleKidsCheckbox()" class="tv-focusable flex items-center justify-between bg-[#222226] border border-white/5 p-3 sm:p-4 rounded-xl w-full text-left transition">
          <div>
            <div class="font-semibold text-sm text-white">Kids Profile</div>
            <div class="text-xs text-zinc-400">Restrict catalog to PG and family titles</div>
          </div>
          <span id="profile-kids-check" class="w-6 h-6 rounded border-2 border-white/30 flex items-center justify-center text-[#E50914]"></span>
        </button>
      </div>

      <div class="flex items-center justify-end gap-3 mt-4 sm:mt-6">
        <button id="delete-profile-btn" onclick="deleteEditingProfile()" class="tv-focusable hidden mr-auto px-4 py-2 sm:py-2.5 rounded-xl bg-red-950/60 border border-red-800/40 text-red-400 hover:bg-red-900/60 text-xs font-bold uppercase tracking-wider transition">
          Delete
        </button>
        <button onclick="closeProfileEditor()" class="tv-focusable px-5 py-2 sm:py-2.5 rounded-xl bg-white/[0.08] hover:bg-white/[0.15] text-sm font-semibold transition">
          Cancel
        </button>
        <button onclick="saveProfileEditor()" class="tv-focusable px-6 py-2 sm:py-2.5 rounded-xl bg-[#E50914] hover:bg-[#FF1E27] text-white text-sm font-bold transition">
          Save
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 4. MAIN TV APP SHELL ==================== -->
  <div id="tv-app-shell" class="hidden min-h-screen bg-[#0E0E10] relative">

    <!-- LEFT EXPANDABLE TV NAVIGATION SIDEBAR -->
    <aside id="tv-sidebar"
      onmouseenter="expandSidebar(true)"
      onmouseleave="handleSidebarMouseLeave()"
      class="fixed top-0 left-0 bottom-0 z-40 w-20 bg-[#09090B]/95 backdrop-blur-xl border-r border-white/[0.07] flex flex-col justify-between py-6 transition-all duration-300 ease-out group overflow-hidden">

      <div class="px-3.5">
        <button onclick="openProfileGate()" data-nav="profiles" class="sidebar-item tv-focusable w-full flex items-center gap-3.5 p-2 rounded-xl hover:bg-white/[0.08] transition text-left">
          <div id="sidebar-avatar" class="w-10 h-10 rounded-lg flex items-center justify-center font-bold text-base shrink-0 shadow-md bg-gradient-to-br from-red-600 to-red-950 text-white"></div>
          <div class="sidebar-label opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap overflow-hidden">
            <div id="sidebar-profile-name" class="font-bold text-sm leading-tight truncate text-white"></div>
            <div class="text-[11px] text-zinc-400">Switch Profile</div>
          </div>
        </button>
      </div>

      <nav id="sidebar-nav-list" class="flex flex-col gap-1 px-3 my-auto"></nav>

      <div class="px-3.5 flex flex-col gap-3">
        <button onclick="toggleSound()" class="tv-focusable w-full flex items-center gap-4 p-2.5 rounded-xl hover:bg-white/[0.08] text-zinc-400 hover:text-white transition">
          <span id="sidebar-sound-icon" class="w-5 h-5 flex items-center justify-center shrink-0"></span>
          <span id="sidebar-sound-text" class="sidebar-label opacity-0 group-hover:opacity-100 transition-opacity text-xs font-semibold whitespace-nowrap">UI Audio: On</span>
        </button>
        <div class="flex items-baseline pl-2.5 pt-1 border-t border-white/[0.06]">
          <span class="font-display text-2xl text-[#E50914] tracking-wider shrink-0">SC</span>
          <span class="font-sans text-sm font-extrabold text-white shrink-0">tv</span>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT VIEWPORT -->
    <main id="tv-main-content" class="pl-20 min-h-screen transition-all duration-300 pb-24">

      <header class="fixed top-0 left-20 right-0 z-30 px-6 sm:px-10 py-4 flex items-center justify-between pointer-events-none bg-gradient-to-b from-[#0E0E10]/90 via-[#0E0E10]/40 to-transparent">
        <div class="flex items-center gap-3 pointer-events-auto">
          <div class="flex items-baseline mr-2">
            <span class="font-display text-2xl text-[#E50914] tracking-wider">SC</span>
            <span class="font-sans text-base font-extrabold text-white">tv</span>
          </div>
          <span id="view-breadcrumb" class="text-[11px] font-bold uppercase tracking-[0.2em] text-zinc-300 bg-white/[0.06] backdrop-blur-md px-3 py-1.5 rounded-md border border-white/10">
            Home
          </span>
          <span id="kids-mode-pill" class="hidden text-[11px] font-extrabold uppercase tracking-wider bg-amber-400 text-black px-3 py-1 rounded-md shadow">
            Kids Mode
          </span>
        </div>

        <div class="flex items-center gap-3 pointer-events-auto">
          <!-- Fix TV #5: header Search raggiungibile col D-pad. -->
          <button onclick="switchTab('search')" class="tv-focusable px-3.5 py-1.5 rounded-lg bg-white/[0.06] hover:bg-white/[0.14] backdrop-blur-md border border-white/10 text-xs font-semibold flex items-center gap-2 text-zinc-200 transition">
            <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span class="hidden sm:inline">Search</span>
          </button>
          <div id="tv-clock" class="text-xs font-semibold text-zinc-300 bg-white/[0.06] backdrop-blur-md px-3.5 py-1.5 rounded-lg border border-white/10 tabular-nums"></div>
        </div>
      </header>

      <div id="view-container"></div>

    </main>
  </div>

  <!-- ==================== 5. TITLE DETAIL MODAL ("MORE INFO") ==================== -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-2 sm:p-6 overflow-y-auto">
    <div id="detail-modal-card" class="relative bg-[#161619] border border-white/10 rounded-2xl max-w-5xl w-full max-h-[92vh] overflow-y-auto no-scrollbar shadow-[0_25px_70px_rgba(0,0,0,0.95)]">
      <button id="close-detail-btn" onclick="closeDetailModal()" class="tv-focusable absolute top-4 right-4 z-30 w-10 h-10 rounded-full bg-black/75 hover:bg-white hover:text-black text-white flex items-center justify-center border border-white/20 transition" aria-label="Close details">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>

      <div id="detail-modal-content"></div>
    </div>
  </div>

  <!-- Fix TV #3: il player HTML5 (#video-player-overlay) e tutte le sue
       funzioni sono RIMOSSI — su TV il playback è delegato al player nativo
       via AndroidJs.play (M3). -->

  <!-- ==================== 7. FLOATING VIRTUAL TV REMOTE ==================== -->
  <!-- Fix TV #8: visibile SOLO senza bridge nativo (anteprima browser). -->
  <div id="virtual-remote-root" class="hidden fixed bottom-5 right-5 z-[70] flex flex-col items-end">
    <div id="virtual-remote-panel" class="hidden mb-3 bg-[#161619]/95 backdrop-blur-xl border border-white/15 rounded-3xl p-4 shadow-[0_20px_50px_rgba(0,0,0,0.9)] w-52">
      <div class="flex items-center justify-between mb-3 pb-2 border-b border-white/10">
        <span class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">SCtv Remote</span>
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
      </div>

      <div class="grid grid-cols-2 gap-2 mb-3">
        <button onclick="handleRemoteAction('back')" class="bg-white/10 hover:bg-white/20 active:scale-95 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
          <span>Back</span>
        </button>
        <button onclick="handleRemoteAction('home')" class="bg-white/10 hover:bg-white/20 active:scale-95 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Home</span>
        </button>
      </div>

      <div class="relative w-36 h-36 mx-auto bg-[#222226] rounded-full border border-white/10 flex items-center justify-center shadow-inner">
        <button onclick="handleRemoteAction('up')" class="absolute top-1.5 left-1/2 -translate-x-1/2 w-10 h-9 flex items-center justify-center text-zinc-400 hover:text-white active:scale-90" aria-label="Up">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8l6 6H6z"/></svg>
        </button>
        <button onclick="handleRemoteAction('down')" class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-10 h-9 flex items-center justify-center text-zinc-400 hover:text-white active:scale-90" aria-label="Down">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 16l-6-6h12z"/></svg>
        </button>
        <button onclick="handleRemoteAction('left')" class="absolute left-1.5 top-1/2 -translate-y-1/2 w-9 h-10 flex items-center justify-center text-zinc-400 hover:text-white active:scale-90" aria-label="Left">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 12l6-6v12z"/></svg>
        </button>
        <button onclick="handleRemoteAction('right')" class="absolute right-1.5 top-1/2 -translate-y-1/2 w-9 h-10 flex items-center justify-center text-zinc-400 hover:text-white active:scale-90" aria-label="Right">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M16 12l-6 6V6z"/></svg>
        </button>
        <button onclick="handleRemoteAction('ok')" class="w-14 h-14 rounded-full bg-[#E50914] hover:bg-[#FF1E27] active:scale-95 text-white font-bold text-xs shadow-lg transition">OK</button>
      </div>
    </div>

    <button onclick="toggleVirtualRemote()" class="px-4 py-2.5 rounded-full bg-[#18181B]/95 hover:bg-[#222226] backdrop-blur-md border border-white/15 shadow-xl text-xs font-semibold flex items-center gap-2 text-zinc-200 transition">
      <svg class="w-4 h-4 text-[#E50914]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="8" r="2"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>
      <span>Remote</span>
    </button>
  </div>

  <!-- ==================== 8. TOAST NOTIFICATION BANNER ==================== -->
  <div id="tv-toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[95] pointer-events-none opacity-0 translate-y-4 transition-all duration-300">
    <div class="bg-white text-black font-bold text-xs sm:text-sm px-5 py-3 rounded-full shadow-2xl flex items-center gap-2.5">
      <span id="tv-toast-dot" class="w-2 h-2 rounded-full bg-[#E50914]"></span>
      <span id="tv-toast-msg"></span>
    </div>
  </div>

  <!-- ==================== JAVASCRIPT APPLICATION LOGIC ==================== -->
  <script>
    /**
     * 0. CRISP VECTOR ICON LIBRARY
     */
    const ICONS = {
      volumeOn: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`,
      volumeOff: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`,
      edit: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
      check: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
      plus: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
      bell: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
      thumbUp: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>`,
      thumbDown: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22h0a3.13 3.13 0 0 1-3-3.88Z"/></svg>`,
      heart: `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
    };

    /**
     * 1. PROCEDURAL WEB AUDIO ENGINE (UI Feedback)
     */
    const AudioEngine = (() => {
      let ctx = null;
      let enabled = true;

      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
      }

      function playTick(freq = 540, duration = 0.03) {
        if (!enabled) return;
        try {
          ensureCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.65, ctx.currentTime + duration);

          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }

      function playSelect() {
        playTick(760, 0.05);
      }

      function playStartupChord() {
        if (!enabled) return;
        try {
          ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const freqs = [65.41, 130.81, 196.00, 261.63];
          freqs.forEach((f, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = idx === 0 ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(f, now + (idx === 0 ? 0 : 0.14));
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(idx === 0 ? 0.2 : 0.08, now + (idx === 0 ? 0.03 : 0.2));
            gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 1.5);
          });
        } catch (e) {}
      }

      return {
        get enabled() { return enabled; },
        setEnabled(val) {
          enabled = val;
        },
        playTick,
        playSelect,
        playStartupChord
      };
    })();

    // Fix TV #15: il toggle audio SI PERSISTE. Il boot payload (settings.uiAudio)
    // ha la precedenza quando arriva; tra un'avvio e l'altro vince il locale.
    (function initAudioPref() {
      try {
        const v = localStorage.getItem('sctv.uiAudio');
        if (v !== null) AudioEngine.setEnabled(v === '1');
      } catch (e) {}
    })();
    function persistAudioPref() {
      try { localStorage.setItem('sctv.uiAudio', AudioEngine.enabled ? '1' : '0'); } catch (e) {}
    }

    /**
     * 1.5 LAYER BRIDGE NATIVO — unico canale con SctvActivity ("AndroidJs").
     *
     * Nativo→JS: UNICO entry window.__sctvReceive(ev) con envelope
     *   {"t":"<tipo>","req":<int|null>,"d":{...}}
     * tipi: boot | catalog | titleDetail | searchResults | myListChanged |
     *       progressChanged | domainChanged | error
     * JS→nativo: metodi @JavascriptInterface di SctvBridge (contratto piano §2).
     */
    const BRIDGE_VERSION = 1;
    const Native = window.AndroidJs || null;
    let reqCounter = 0;
    function nextReq() {
      reqCounter += 1;
      return reqCounter;
    }

    let bootReceived = false;
    let pendingDetail = null; // { titleId, req } — correlazione titleDetail (M2)
    let pendingSeason = null; // { titleId, req } — correlazione titleSeason (M2)

    function numericTitleId(item) {
      if (!item) return 0;
      if (typeof item.titleId === 'number' && item.titleId > 0) return item.titleId;
      const m = String(item.id || '').match(/(\d+)$/);
      return m ? parseInt(m[1], 10) : 0;
    }

    function replaceCatalog(list) {
      CATALOG.length = 0;
      for (const it of (list || [])) CATALOG.push(it);
    }

    /** Upsert di un item nel catalogo. Con fieldsOverride (es. top10Rank del
     *  tab "new") aggiorna SOLO quei campi sui titoli già noti. Senza, il
     *  nuovo item vince solo se più ricco (episodi/genres): un item lean
     *  (slider/search) non deve cancellare i metadati completi già arrivati
     *  dal dettaglio — in ogni caso una synopsis vuota si riempie. Ritorna
     *  l'item inserito/aggiornato, o null. */
    function upsertCatalogItem(item, fieldsOverride = null) {
      if (!item || !item.id) return null;
      const idx = CATALOG.findIndex(c => c.id === item.id);
      if (idx >= 0) {
        const cur = CATALOG[idx];
        if (fieldsOverride) {
          Object.assign(cur, fieldsOverride);
          return cur;
        }
        if (metaScore(item) > metaScore(cur)) {
          // Il dettaglio (più ricco) non porta il rank top10: conservalo.
          if (cur.top10Rank !== undefined && item.top10Rank === undefined) {
            item.top10Rank = cur.top10Rank;
          }
          CATALOG[idx] = item;
        } else if (!cur.synopsis && item.synopsis) {
          cur.synopsis = item.synopsis;
        }
        return CATALOG[idx];
      }
      if (fieldsOverride) Object.assign(item, fieldsOverride);
      CATALOG.push(item);
      return item;
    }

    /** Ricchezza di metadati: 2 = episodi, 1 = genres (il dettaglio vince
     *  sempre sugli item lean degli slider/search). */
    function metaScore(it) {
      return ((it.episodes || []).length > 0 ? 2 : 0) + ((it.genres || []).length > 0 ? 1 : 0);
    }

    /** Merge degli episodi di una stagione nell'item: sostituisce quelli
     *  della stagione richiesta e li tiene ordinati (stagione, numero). */
    function upsertEpisodes(item, season, episodes) {
      const kept = (item.episodes || []).filter(ep => (ep.season || 1) !== season);
      item.episodes = kept.concat(
        (episodes || []).map(ep => Object.assign({ season }, ep))
      ).sort((a, b) => (a.season || 1) - (b.season || 1) || (a.ep || 0) - (b.ep || 0));
    }

    /** Applica l'elenco cw (continue watching): item sintetico se il titolo
     *  non è in catalogo + mappa state.watchProgress per la rail. */
    function applyContinueWatching(list) {
      (list || []).forEach(cw => {
        if (!cw || !cw.id) return;
        if (!CATALOG.some(c => c.id === cw.id)) {
          CATALOG.push({
            id: cw.id,
            titleId: cw.titleId || numericTitleId({ id: cw.id }),
            title: cw.name || 'In corso',
            type: cw.type || 'movie',
            isOriginal: false, isKids: false,
            match: 0, year: 0, maturity: 'NR', durationLabel: '',
            badges: [], genres: [], cast: [], creator: null,
            synopsis: cw.tag || '',
            posterUrl: cw.poster || '', backdropUrl: cw.poster || '',
            url: cw.url || '', comingSoon: false, seasons: 0, episodes: []
          });
        }
        state.watchProgress[cw.id] = {
          progress: cw.progress || 0,
          label: cw.label || '',
          season: cw.season || 1,
          episode: cw.episode || 1
        };
      });
    }

    /** Spinner nel view-container (fix TV #12): tra boot e payload NON si
     *  vede mai il flash "No Titles Available". */
    function showViewLoading() {
      const container = document.getElementById('view-container');
      container.innerHTML = `
        <div id="view-loading" class="fixed inset-0 flex flex-col items-center justify-center">
          <div class="w-10 h-10 rounded-full border-4 border-white/15 border-t-[#E50914] animate-spin"></div>
          <p class="mt-4 text-sm text-zinc-400">Caricamento catalogo…</p>
        </div>`;
      refreshFocusableElements();
    }

    function hideViewLoading() {
      const c = document.getElementById('view-loading');
      if (c) c.parentElement.innerHTML = '';
    }

    window.__sctvReceive = function (ev) {
      try {
        if (!ev || typeof ev.t !== 'string') return;
        const d = ev.d || {};
        switch (ev.t) {
          case 'boot': {
            bootReceived = true;
            hideViewLoading();
            if (Array.isArray(d.catalog)) replaceCatalog(d.catalog);
            state.rows = d.rows || {};
            if (Array.isArray(d.myList)) state.myList = d.myList.slice();
            // Lista CW COMPLETA dal nativo (per il profilo corrente): reset
            // della mappa prima del merge — mai voci di profili precedenti.
            state.watchProgress = {};
            applyContinueWatching(d.continueWatching);
            if (d.heroTitleId) state.heroTitleId = d.heroTitleId;
            if (d.settings && typeof d.settings.uiAudio === 'boolean') {
              AudioEngine.setEnabled(d.settings.uiAudio);
              persistAudioPref();
              syncAudioIcons();
            }
            if (state.currentProfile) renderCurrentView();
            break;
          }

          case 'catalog': {
            // Righe/tab reali (M2): per home/tv/movie il catalogo si SOSTITUISCE
            // e le righe vengono assegnate SOLO al tab richiesto (boot già le
            // contiene tutte); per "new" il top10 si MERGE (upsert) così i
            // metadati più ricchi già noti restano intatti.
            bootReceived = true;
            hideViewLoading();
            if (d.tab === 'new') {
              const top10 = Array.isArray(d.top10) ? d.top10 : (Array.isArray(d.catalog) ? d.catalog : []);
              top10.forEach(it => {
                // Rank solo se presente: mai sovrascriverlo con undefined.
                upsertCatalogItem(it, it.top10Rank ? { top10Rank: it.top10Rank } : null);
              });
            } else {
              if (Array.isArray(d.catalog)) replaceCatalog(d.catalog);
              if (Array.isArray(d.rows)) state.rows[d.tab] = d.rows;
            }
            if (state.currentProfile) renderCurrentView(false);
            break;
          }

          case 'titleDetail': {
            const it = d.item;
            if (!it) break;
            const idx = CATALOG.findIndex(c => c.id === it.id);
            if (idx >= 0) CATALOG[idx] = it; else CATALOG.push(it);
            if (pendingDetail && ev.req === pendingDetail.req) {
              pendingDetail = null;
              state.detailModalTitleId = it.id;
              // La stagione servita dal sito può non essere la 1: allinea il
              // selettore ai dati reali.
              if (it.currentSeason) state.detailSelectedSeason = it.currentSeason;
              renderDetailModalContent();
            }
            break;
          }

          case 'titleSeason': {
            // Cambio stagione via partial reload (AndroidJs.loadDetailSeason):
            // episodi merged nel modal + re-render mirato.
            const it = CATALOG.find(c => pendingSeason && c.id === pendingSeason.titleId);
            if (pendingSeason && ev.req === pendingSeason.req && it) {
              pendingSeason = null;
              state.seasonLoading = false;
              upsertEpisodes(it, d.season || state.detailSelectedSeason, Array.isArray(d.episodes) ? d.episodes : []);
              state.detailSelectedSeason = d.season || state.detailSelectedSeason;
              renderDetailModalContent();
              // Fuoco sul selettore stagione, come fa changeDetailSeason.
              refreshFocusableElements();
              const prev = document.getElementById('season-prev');
              setTVFocus(prev && focusableList.includes(prev) ? prev : focusableList[0]);
            }
            break;
          }

          case 'searchResults': {
            bootReceived = true;
            hideViewLoading();
            if (state.activeTab === 'search') {
              // Risposta non più attesa (reset o query nuova in volo): scartata.
              if (ev.req == null || ev.req !== state.pendingSearchReq) break;
              state.pendingSearchReq = null;
              state.searchPending = false;
              if (d.query != null) state.searchQuery = d.query;
              const inp = document.getElementById('tv-search-input');
              if (inp && inp.value !== state.searchQuery) inp.value = state.searchQuery;
              // I risultati vengono FUSI nel catalogo (upsert, senza rimpiazzare
              // titoli più ricchi già noti) e ricordati per la query corrente.
              const ids = [];
              (Array.isArray(d.catalog) ? d.catalog : []).forEach(it => {
                const merged = upsertCatalogItem(it);
                if (merged) ids.push(merged.id);
              });
              state.remoteResults = { query: state.searchQuery, ids };
              const wrap = document.getElementById('search-results-wrap');
              if (wrap) {
                wrap.innerHTML = renderSearchResultsInner();
                // Se il fuoco era su una card della griglia sostituita si
                // ripristina sul primo risultato; resta sul tasto tastiera.
                refreshFocusableElements();
                if (!currentFocusedEl || !focusableList.includes(currentFocusedEl)) {
                  const firstCard = wrap.querySelector('.tv-focusable');
                  if (firstCard) setTVFocus(firstCard);
                }
              }
            }
            break;
          }

          case 'categories': {
            // FIX categorie (dati reali): generi dell'archivio (/it/archive →
            // props.genres) + griglia delle prime 60 (genere "All"). I titoli
            // tornano nel CATALOG con upsert, come per search. Lo stato viene
            // memorizzato anche se l'utente è su un altro tab (il push non
            // deve ri-renderizzare la vista corrente né rubare il fuoco).
            bootReceived = true;
            hideViewLoading();
            if (state.pendingCategoriesReq != null && ev.req !== state.pendingCategoriesReq) break;
            state.pendingCategoriesReq = null;
            state.categoriesLoading = false;
            state.categoriesGenres = Array.isArray(d.genres) ? d.genres : [];
            const catIds = [];
            (Array.isArray(d.catalog) ? d.catalog : []).forEach(it => {
              const merged = upsertCatalogItem(it);
              if (merged) catIds.push(merged.id);
            });
            state.categoriesIds = catIds;
            state.selectedGenreId = 'all';
            state.genreIds = catIds;
            if (state.activeTab === 'categories') {
              renderCurrentView(false);
              // Fuoco sul primo chip (prima del payload restava sulla sidebar).
              const chip = document.querySelector('#categories-chips .tv-focusable');
              if (chip) setTVFocus(chip);
            }
            break;
          }

          case 'genreData': {
            // FIX categorie: risposta del filtro genere — aggiornamento MIRATO
            // della sola griglia (#categories-grid-wrap): i chip restano in
            // pagina e il fuoco resta dove è (niente renderCurrentView).
            if (state.activeTab !== 'categories') break;
            if (state.pendingGenreReq == null || ev.req !== state.pendingGenreReq) break;
            state.pendingGenreReq = null;
            state.genreLoading = false;
            if (d.genreId != null) state.selectedGenreId = String(d.genreId);
            const gIds = [];
            (Array.isArray(d.catalog) ? d.catalog : []).forEach(it => {
              const merged = upsertCatalogItem(it);
              if (merged) gIds.push(merged.id);
            });
            state.genreIds = gIds;
            updateCategoriesGrid();
            break;
          }

          case 'myListChanged': {
            if (Array.isArray(d.ids)) {
              state.myList = d.ids.slice();
              renderCurrentView(false); // push nativo: mai rubafuoco
              if (state.detailModalTitleId) renderDetailModalContent();
            }
            break;
          }

          case 'progressChanged': {
            // Fix TV #13: aggiornamento MIRATO della rail #row-continue,
            // MAI renderCurrentView integrale (il fuoco resta dove è).
            // Lista COMPLETA dal nativo (per il profilo corrente): reset
            // della mappa prima del merge, così al cambio profilo le voci
            // del profilo precedente non sopravvivono.
            state.watchProgress = {};
            applyContinueWatching(d.continueWatching);
            syncContinueRow(d.continueWatching || []);
            renderContinueRail();
            break;
          }

          case 'domainChanged': {
            showToast('Catalogo aggiornato: ' + (d.host || 'nuovo dominio'));
            break;
          }

          case 'error': {
            if (!bootReceived) renderErrorCard(d.message || 'Errore di connessione');
            else showToast(d.message || 'Errore');
            // Rilascia le attese correlate al req fallito (spinner stagione).
            if (pendingSeason && ev.req === pendingSeason.req) {
              pendingSeason = null;
              state.seasonLoading = false;
              renderDetailModalContent();
            }
            if (pendingDetail && ev.req === pendingDetail.req) pendingDetail = null;
            // Ricerca server fallita: via lo stato "Ricerca in corso…".
            if (state.pendingSearchReq != null && ev.req === state.pendingSearchReq) {
              state.pendingSearchReq = null;
              state.searchPending = false;
              if (state.activeTab === 'search') updateSearchView();
            }
            // Categorie: genera il vuoto → il render mostra l'empty-state col
            // bottone Riprova (retryLoadCategories).
            if (state.pendingCategoriesReq != null && ev.req === state.pendingCategoriesReq) {
              state.pendingCategoriesReq = null;
              state.categoriesLoading = false;
              if (state.activeTab === 'categories') {
                renderCurrentView(false);
                const retry = focusableList.find(el => el.closest('#view-container'));
                if (retry) setTVFocus(retry);
              }
            }
            // Filtro genere fallito: la griglia torna al suo stato (vuota o
            // "Nessun titolo"), i chip restano navigabili.
            if (state.pendingGenreReq != null && ev.req === state.pendingGenreReq) {
              state.pendingGenreReq = null;
              state.genreLoading = false;
              if (state.activeTab === 'categories') updateCategoriesGrid();
            }
            break;
          }
        }
      } catch (e) {
        console.error('__sctvReceive', e);
      }
    };

    /** Contratto BACK nativo (chiamato da SctvActivity): 'exit' = chiudi app,
     *  'stay' = la pagina ha già gestito via handleBackNavigation(). */
    window.__sctvBackState = function () {
      const gateShown = !document.getElementById('profile-screen').classList.contains('hidden');
      if (gateShown || !state.currentProfile) return 'exit';
      handleBackNavigation();
      return 'stay';
    };

    // Helper bridge invocati dalla UI (view settings + card errore).
    function openSettings() {
      AudioEngine.playSelect();
      if (Native && Native.openSettings) Native.openSettings();
      else showToast('Bridge nativo non attivo (anteprima browser)');
    }
    function openSiteInterface() {
      AudioEngine.playSelect();
      if (Native && Native.openSiteInterface) Native.openSiteInterface();
      else showToast('Bridge nativo non attivo (anteprima browser)');
    }
    function retryConnection() {
      AudioEngine.playSelect();
      if (Native && Native.retryConnection) {
        Native.retryConnection();
      } else {
        showViewLoading();
        setTimeout(() => {
          if (!bootReceived) {
            renderErrorCard("Bridge nativo non attivo (anteprima browser): i dati reali arrivano solo dall'app Android.");
          }
        }, 400);
      }
    }

    /** Chiamata a fine window.onload: con bridge il nativo risponde col push
     *  dell'evento boot. Se entro 8s non è arrivato (rete giù, bridge morto)
     *  si mostra la error-card "Connessione al sito…" col bottone Riprova:
     *  niente dati finti come fallback. */
    function bootReady() {
      if (Native && Native.bootReady) {
        // Profilo corrente (localStorage) AL NATIVO PRIMA del boot: anche il
        // PRIMO payload è scoped (My List / Continua a guardare del profilo).
        try {
          const saved = localStorage.getItem(PROFILE_CURRENT_KEY);
          if (saved && Native.setActiveProfile) Native.setActiveProfile(saved);
        } catch (e) {}
        Native.bootReady();
        setTimeout(() => {
          if (!bootReceived) {
            renderErrorCard("Connessione al sito… Il catalogo non risponde. Controlla la rete e Riprova.");
          }
        }, 8000);
      } else {
        // Anteprima browser (nessun AndroidJs): i dati reali non possono
        // arrivare — stessa error-card, coerente con il fallback nativo.
        renderErrorCard("Bridge nativo non attivo (anteprima browser): apri l'app per il catalogo reale.");
      }
    }

    /**
     * 2. SCTV CATALOG DATABASE (Populate with real media items)
     * Expected item shape:
     * {
     *   id, titleId, title, type ('tv'|'movie'), isOriginal, isKids, top10Rank,
     *   match, year, maturity, durationLabel, badges: [], genres: [],
     *   synopsis, cast: [], creator, posterUrl, backdropUrl, streamUrl,
     *   comingSoon, releaseDate, seasons, episodes: [{ ep, id, season, title, duration, desc, streamUrl }]
     * }
     */

    // M2: il catalogo DEMO e' stato rimosso. I dati arrivano SOLO dal bridge
    // (evento boot con payload reale di SctvRepository); il fallback visuale
    // quando il boot non arriva e' la error-card "Connessione al sito..." con
    // il bottone Riprova (renderErrorCard + retryConnection), non dati finti.


    const CATALOG = [];

    /**
     * 3. APPLICATION STATE & AVATAR PRESETS
     */
    const AVATAR_PRESETS = [
      { id: 'crimson', bg: 'from-[#E50914] to-[#6B0409]', label: 'Crimson' },
      { id: 'cobalt', bg: 'from-blue-600 to-indigo-950', label: 'Cobalt' },
      { id: 'emerald', bg: 'from-emerald-500 to-teal-950', label: 'Emerald' },
      { id: 'amber', bg: 'from-amber-400 via-orange-500 to-rose-600', label: 'Solar' },
      { id: 'violet', bg: 'from-violet-600 to-fuchsia-950', label: 'Violet' },
    ];

    function renderAvatarMark(name, isKids = false) {
      if (isKids) {
        return `<span class="font-display text-2xl sm:text-3xl tracking-wider text-white">KIDS</span>`;
      }
      const initials = (name || 'SC').trim().slice(0, 2).toUpperCase();
      return `<span class="font-display text-4xl sm:text-5xl tracking-wider text-white">${initials}</span>`;
    }

    const state = {
      profiles: [],
      currentProfile: null,
      managingProfiles: false,
      editingProfileId: null,
      selectedPresetIdx: 0,

      activeTab: 'home',
      searchQuery: '',
      // Ricerca server in volo: tra il debounce e la risposta `searchResults`
      // la griglia mostra lo stato "Ricerca in corso…" (req per scartare le
      // risposte superate dall'utente che continua a scrivere).
      searchPending: false,
      pendingSearchReq: null,

      // Tab Categorie (dati REALI dall'archivio): generi e griglia "All"
      // arrivano dall'evento `categories` (loadCategories), il filtro genere
      // dall'evento `genreData` (loadGenre, aggiornamento MIRATO della griglia).
      categoriesGenres: null,     // null = mai caricato; [{id,name}] dopo il load
      categoriesIds: [],          // ids CATALOG delle prime 60 (genere "All")
      categoriesLoading: false,
      pendingCategoriesReq: null,
      selectedGenreId: 'all',     // 'all' | id numerico del genere (stringa)
      genreIds: [],               // ids CATALOG del genere selezionato
      genreLoading: false,
      pendingGenreReq: null,

      myList: [],
      ratings: {},
      reminders: [],
      watchProgress: {},
      rows: {},

      heroTitleId: null,
      heroMuted: true,

      detailModalTitleId: null,
      detailSelectedSeason: 1,
      seasonLoading: false,

      // Risultati della ricerca server per la query corrente: {query, ids}.
      remoteResults: null,

      virtualRemoteOpen: false,
    };

    // Fix TV #11: profili in localStorage (sctv.profiles / sctv.currentProfileId).
    const PROFILE_STORE_KEY = 'sctv.profiles';
    const PROFILE_CURRENT_KEY = 'sctv.currentProfileId';

    function loadProfiles() {
      try {
        const raw = localStorage.getItem(PROFILE_STORE_KEY);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length > 0) return arr;
        }
      } catch (e) {}
      // Primo boot: profilo default "Predefinito".
      return [{ id: 'p-default', name: 'Predefinito', avatarBg: AVATAR_PRESETS[0].bg, isKids: false }];
    }

    function persistProfiles() {
      try { localStorage.setItem(PROFILE_STORE_KEY, JSON.stringify(state.profiles)); } catch (e) {}
    }

    function persistCurrentProfileId(id) {
      try { localStorage.setItem(PROFILE_CURRENT_KEY, id); } catch (e) {}
    }

    // Stato JS PER-PROFILO (rating/reminder): chiavi localStorage con
    // suffisso profilo — caricate al select del profilo, salvate a ogni
    // modifica. My List e "Continua a guardare" vivono invece negli store
    // NATIVI scopati (AndroidJs.setActiveProfile → push myListChanged /
    // progressChanged del profilo scelto).
    function currentProfileKey(base) {
      const id = state.currentProfile ? state.currentProfile.id : 'default';
      return base + '_' + String(id).replace(/[^A-Za-z0-9_\-]/g, '');
    }
    function loadProfileScopedState(profileId) {
      const safe = String(profileId || '').replace(/[^A-Za-z0-9_\-]/g, '');
      try {
        const r = localStorage.getItem('sctv.ratings_' + safe);
        state.ratings = r ? (JSON.parse(r) || {}) : {};
      } catch (e) { state.ratings = {}; }
      try {
        const m = localStorage.getItem('sctv.reminders_' + safe);
        state.reminders = m ? (JSON.parse(m) || []) : [];
      } catch (e) { state.reminders = []; }
    }
    function persistRatings() {
      try { localStorage.setItem(currentProfileKey('sctv.ratings'), JSON.stringify(state.ratings || {})); } catch (e) {}
    }
    function persistReminders() {
      try { localStorage.setItem(currentProfileKey('sctv.reminders'), JSON.stringify(state.reminders || [])); } catch (e) {}
    }

    ];

    /**
     * 4. HELPER UTILITIES
     */
    function getScopedCatalog() {
      if (state.currentProfile && state.currentProfile.isKids) {
        return CATALOG.filter(item => item.isKids);
      }
      return CATALOG;
    }

    function getTitleById(id) {
      return CATALOG.find(t => t.id === id) || CATALOG[0] || null;
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('tv-toast');
      document.getElementById('tv-toast-msg').textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-4');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2400);
    }

    function syncAudioIcons() {
      const on = AudioEngine.enabled;
      const iconHTML = on ? ICONS.volumeOn : ICONS.volumeOff;
      const profIcon = document.getElementById('sound-icon-profile');
      const profLabel = document.getElementById('sound-label-profile');
      const sideIcon = document.getElementById('sidebar-sound-icon');
      const sideText = document.getElementById('sidebar-sound-text');

      if (profIcon) profIcon.innerHTML = iconHTML;
      if (profLabel) profLabel.textContent = on ? 'UI Audio: On' : 'UI Audio: Off';
      if (sideIcon) sideIcon.innerHTML = iconHTML;
      if (sideText) sideText.textContent = on ? 'UI Audio: On' : 'UI Audio: Off';
    }

    function toggleSound() {
      const next = !AudioEngine.enabled;
      AudioEngine.setEnabled(next);
      persistAudioPref();
      if (next) AudioEngine.playSelect();
      syncAudioIcons();
      showToast(next ? 'TV Interface Audio Enabled' : 'TV Interface Audio Muted');
    }

    function updateClock() {
      const now = new Date();
      const str = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const el = document.getElementById('tv-clock');
      if (el) el.textContent = str;
    }
    setInterval(updateClock, 15000);

    /** Card di errore con Riprova (bridge retryConnection). */
    function renderErrorCard(msg) {
      const container = document.getElementById('view-container');
      container.innerHTML = `
        <div class="pt-32 px-6 sm:px-10 max-w-2xl mx-auto text-center">
          <div class="bg-[#18181B] border border-white/10 rounded-2xl p-12 shadow-xl">
            <h2 class="text-2xl font-bold mb-2">Connessione al sito…</h2>
            <p class="text-sm text-zinc-400 mb-6">${msg}</p>
            <button onclick="retryConnection()" class="tv-focusable px-6 py-3 rounded-xl bg-[#E50914] hover:bg-[#FF1E27] text-white font-bold text-sm">Riprova</button>
          </div>
        </div>`;
      refreshFocusableElements();
      setTVFocus(focusableList[0]);
    }

    /**
     * 5. PROFILE GATE & MANAGEMENT
     */
    function renderProfilesGrid() {
      const grid = document.getElementById('profiles-grid');
      const heading = document.getElementById('profile-heading');
      const manageBtn = document.getElementById('manage-profiles-btn');

      if (state.profiles.length > 0) {
        manageBtn.classList.remove('hidden');
      } else {
        manageBtn.classList.add('hidden');
        state.managingProfiles = false;
      }

      heading.textContent = state.managingProfiles ? 'Manage Profiles' : "Who's watching?";
      manageBtn.textContent = state.managingProfiles ? 'Done' : 'Manage Profiles';
      manageBtn.className = state.managingProfiles
        ? 'tv-focusable px-8 py-3 rounded-lg bg-white text-black font-bold tracking-wider uppercase text-xs transition'
        : 'tv-focusable px-8 py-3 rounded-lg border border-zinc-700 text-zinc-300 hover:text-white hover:border-white font-semibold tracking-wider uppercase text-xs transition';

      let html = state.profiles.map(p => `
        <button onclick="handleProfileClick('${p.id}')"
          class="tv-focusable group flex flex-col items-center gap-3.5 p-2 rounded-2xl focus:outline-none">
          <div class="relative w-28 h-28 sm:w-36 sm:h-36 rounded-2xl bg-gradient-to-br ${p.avatarBg} flex items-center justify-center shadow-2xl border-2 border-white/10 group-hover:border-white transition overflow-hidden">
            ${renderAvatarMark(p.name, p.isKids)}
            ${state.managingProfiles ? `
              <div class="absolute inset-0 bg-black/70 flex items-center justify-center">
                <div class="w-11 h-11 rounded-full border-2 border-white flex items-center justify-center text-white">
                  ${ICONS.edit}
                </div>
              </div>
            ` : ''}
          </div>
          <span class="text-zinc-400 group-hover:text-white font-semibold text-base sm:text-lg transition">${p.name}</span>
        </button>
      `).join('');

      if (state.profiles.length < 5) {
        html += `
          <button onclick="openProfileEditor(null)"
            class="tv-focusable group flex flex-col items-center gap-3.5 p-2 rounded-2xl focus:outline-none">
            <div class="w-28 h-28 sm:w-36 sm:h-36 rounded-2xl bg-white/[0.03] group-hover:bg-white/[0.08] border-2 border-dashed border-zinc-700 group-hover:border-white flex items-center justify-center text-zinc-500 group-hover:text-white transition">
              <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
            <span class="text-zinc-500 group-hover:text-white font-semibold text-base sm:text-lg transition">Add Profile</span>
          </button>
        `;
      }

      grid.innerHTML = html;
      refreshFocusableElements();
      // Fix TV #6: dopo ogni render del gate il fuoco torna sul primo profilo.
      setTVFocus(focusableList[0]);
    }

    function toggleManageProfiles() {
      AudioEngine.playSelect();
      state.managingProfiles = !state.managingProfiles;
      renderProfilesGrid();
    }

    function handleProfileClick(id) {
      const profile = state.profiles.find(p => p.id === id);
      if (!profile) return;

      if (state.managingProfiles) {
        AudioEngine.playSelect();
        openProfileEditor(profile);
        return;
      }

      AudioEngine.playStartupChord();
      state.currentProfile = profile;
      persistCurrentProfileId(id);
      // Stato JS del profilo (rating/reminder da localStorage per-profilo).
      loadProfileScopedState(id);
      // Dati nativi SCOPATI al profilo: setActiveProfile PRIMA di entrare in
      // home — il nativo memorizza l'id (e, se il boot è già avvenuto,
      // ripush myListChanged + progressChanged per ridisegnare la UI coi
      // dati del profilo scelto, senza rubare il fuoco).
      if (Native && Native.setActiveProfile) Native.setActiveProfile(profile.id);
      document.getElementById('profile-screen').classList.add('hidden');
      document.getElementById('profile-screen').classList.remove('flex');
      document.getElementById('tv-app-shell').classList.remove('hidden');

      const sideAvatar = document.getElementById('sidebar-avatar');
      sideAvatar.className = `w-10 h-10 rounded-lg flex items-center justify-center font-display text-lg tracking-wider shrink-0 shadow-md bg-gradient-to-br ${profile.avatarBg} text-white`;
      sideAvatar.textContent = profile.isKids ? 'KIDS' : profile.name.slice(0, 2).toUpperCase();
      document.getElementById('sidebar-profile-name').textContent = profile.name;

      const kidsPill = document.getElementById('kids-mode-pill');
      if (profile.isKids) {
        kidsPill.classList.remove('hidden');
      } else {
        kidsPill.classList.add('hidden');
      }

      state.activeTab = 'home';
      renderSidebarNav();
      renderCurrentView();
      showToast(`Signed in as ${profile.name}`);
    }

    function openProfileGate() {
      AudioEngine.playSelect();
      state.managingProfiles = false;
      document.getElementById('tv-app-shell').classList.add('hidden');
      const screen = document.getElementById('profile-screen');
      screen.classList.remove('hidden');
      screen.classList.add('flex');
      renderProfilesGrid();
    }

    // Mini-tastiera del modal profilo (fix TV #2): il nome si compone a
    // schermo, niente IME di sistema.
    let profNameDraft = '';
    let profKidsChecked = false;

    function renderProfileKeyboard() {
      const keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
      const box = document.getElementById('profile-kbd');
      if (!box) return;
      // Fix altezze piccole: tasti su 9 colonne (4 righe) con altezza fissa
      // h-9 invece di aspect-square — la griglia 6x6 quadrata superava i 540px
      // del modal profilo e spingeva i bottoni Salvare/Eliminare fuori schermo.
      box.innerHTML = `
        <div class="grid grid-cols-3 gap-2 mb-2">
          <button type="button" onclick="profAppendChar(' ')" class="tv-focusable py-2 rounded-lg bg-white/[0.08] hover:bg-white/[0.18] text-xs font-bold uppercase tracking-wider transition">Spazio</button>
          <button type="button" onclick="profBackspaceChar()" class="tv-focusable py-2 rounded-lg bg-white/[0.08] hover:bg-white/[0.18] text-xs font-bold uppercase tracking-wider transition">Canc</button>
          <button type="button" onclick="profClearName()" class="tv-focusable py-2 rounded-lg bg-white/[0.08] hover:bg-white/[0.18] text-xs font-bold uppercase tracking-wider transition">Reset</button>
        </div>
        <div class="grid grid-cols-9 gap-1">
          ${keys.map(k => `
            <button type="button" onclick="profAppendChar('${k}')"
              class="tv-focusable h-9 rounded-lg bg-[#222226] hover:bg-white hover:text-black font-bold text-sm flex items-center justify-center transition">
              ${k}
            </button>
          `).join('')}
        </div>`;
    }

    function profAppendChar(ch) {
      AudioEngine.playTick(600);
      if (profNameDraft.length < 18) profNameDraft += ch;
      syncProfileNameDraft();
    }
    function profBackspaceChar() {
      AudioEngine.playTick(420);
      profNameDraft = profNameDraft.slice(0, -1);
      syncProfileNameDraft();
    }
    function profClearName() {
      AudioEngine.playTick(420);
      profNameDraft = '';
      syncProfileNameDraft();
    }
    function syncProfileNameDraft() {
      const inp = document.getElementById('profile-name-input');
      if (inp) inp.value = profNameDraft;
    }

    function renderKidsToggle() {
      const mark = document.getElementById('profile-kids-check');
      if (mark) mark.innerHTML = profKidsChecked ? ICONS.check : '';
    }

    function toggleKidsCheckbox() {
      AudioEngine.playTick();
      profKidsChecked = !profKidsChecked;
      renderKidsToggle();
    }

    function openProfileEditor(profile) {
      state.editingProfileId = profile ? profile.id : null;
      document.getElementById('profile-editor-title').textContent = profile ? 'Edit Profile' : 'Add Profile';
      profNameDraft = profile ? profile.name : '';
      document.getElementById('profile-name-input').value = profNameDraft;
      profKidsChecked = profile ? profile.isKids : false;
      renderKidsToggle();

      const delBtn = document.getElementById('delete-profile-btn');
      if (profile) {
        delBtn.classList.remove('hidden');
      } else {
        delBtn.classList.add('hidden');
      }

      const foundIdx = profile ? AVATAR_PRESETS.findIndex(a => a.bg === profile.avatarBg) : 0;
      state.selectedPresetIdx = foundIdx >= 0 ? foundIdx : 0;
      renderAvatarPresets();

      const modal = document.getElementById('profile-editor-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      refreshFocusableElements();
      setTVFocus(focusableList[0]);
    }

    function renderAvatarPresets() {
      const container = document.getElementById('avatar-color-picker');
      container.innerHTML = AVATAR_PRESETS.map((preset, idx) => `
        <button type="button" onclick="selectAvatarPreset(${idx})"
          class="tv-focusable h-12 rounded-xl bg-gradient-to-br ${preset.bg} flex items-center justify-center text-[11px] font-bold uppercase tracking-wider text-white transition ${state.selectedPresetIdx === idx ? 'ring-2 ring-white scale-105' : 'opacity-65 hover:opacity-100'}">
          ${preset.label}
        </button>
      `).join('');
    }

    function selectAvatarPreset(idx) {
      AudioEngine.playTick();
      state.selectedPresetIdx = idx;
      renderAvatarPresets();
    }

    function closeProfileEditor() {
      const modal = document.getElementById('profile-editor-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      refreshFocusableElements();
      setTVFocus(focusableList[0]);
    }

    function saveProfileEditor() {
      const rawName = profNameDraft.trim();
      if (!rawName) {
        showToast('Please enter a profile name');
        return;
      }
      const isKids = profKidsChecked;
      const preset = AVATAR_PRESETS[state.selectedPresetIdx];

      if (state.editingProfileId) {
        const idx = state.profiles.findIndex(p => p.id === state.editingProfileId);
        if (idx >= 0) {
          state.profiles[idx] = { ...state.profiles[idx], name: rawName, avatarBg: preset.bg, isKids };
        }
        showToast('Profile updated');
      } else {
        state.profiles.push({
          id: 'p-' + Date.now(),
          name: rawName,
          avatarBg: preset.bg,
          isKids
        });
        showToast(`Created profile "${rawName}"`);
      }

      AudioEngine.playSelect();
      persistProfiles();
      closeProfileEditor();
      renderProfilesGrid();
    }

    function deleteEditingProfile() {
      if (!state.editingProfileId) return;
      state.profiles = state.profiles.filter(p => p.id !== state.editingProfileId);
      // Il default non deve mai mancare: ricreato se l'utente ha cancellato tutto.
      if (state.profiles.length === 0) {
        state.profiles = [{ id: 'p-default', name: 'Predefinito', avatarBg: AVATAR_PRESETS[0].bg, isKids: false }];
      }
      AudioEngine.playSelect();
      persistProfiles();
      closeProfileEditor();
      renderProfilesGrid();
      showToast('Profile deleted');
    }

    /**
     * 6. SIDEBAR NAVIGATION
     */
    function expandSidebar(expand) {
      const sb = document.getElementById('tv-sidebar');
      if (!sb) return;
      if (expand) sb.classList.add('sidebar-expanded');
      else sb.classList.remove('sidebar-expanded');
    }

    function handleSidebarMouseLeave() {
      if (currentFocusedEl && currentFocusedEl.closest('#tv-sidebar')) return;
      expandSidebar(false);
    }

    function renderSidebarNav() {
      const nav = document.getElementById('sidebar-nav-list');
      nav.innerHTML = NAV_ITEMS.map(item => {
        const active = state.activeTab === item.id;
        return `
          <button onclick="switchTab('${item.id}')" data-tab="${item.id}"
            class="tv-focusable relative flex items-center gap-4 px-3.5 py-3 rounded-xl transition ${active ? 'text-white bg-white/[0.12] font-bold' : 'text-zinc-400 hover:text-white hover:bg-white/[0.06] font-medium'}">
            ${active ? `<span class="absolute left-0 top-2.5 bottom-2.5 w-1 bg-[#E50914] rounded-r-full"></span>` : ''}
            ${item.icon}
            <span class="sidebar-label opacity-0 group-hover:opacity-100 transition-opacity duration-200 text-sm whitespace-nowrap">${item.label}</span>
          </button>
        `;
      }).join('');
    }

    function switchTab(tabId) {
      AudioEngine.playSelect();
      // Sul TV "Settings" apre il dialog NATIVO (contratto bridge
      // openSettings); il view web resta per l'anteprima browser.
      if (tabId === 'settings' && Native && Native.openSettings) {
        Native.openSettings();
        return;
      }
      state.activeTab = tabId;
      const navMeta = NAV_ITEMS.find(n => n.id === tabId);
      document.getElementById('view-breadcrumb').textContent = navMeta ? navMeta.label : 'Browse';
      renderSidebarNav();
      // FIX search/categorie: NON sono tab a righe. Il vecchio percorso
      // loadTab+spinner li bloccava per sempre: hasRows era sempre false →
      // showViewLoading() + return (renderSearchView mai invocata) e
      // Native.loadTab('search') riceveva un tab ignoto dal repository
      // (tabPayload → else → null → evento error "Tab non raggiungibile").
      // Ora render immediato con fuoco nel contenuto, non sulla sidebar.
      if (tabId === 'search' || tabId === 'categories') {
        if (tabId === 'categories' &&
            !Array.isArray(state.categoriesGenres) &&
            !state.categoriesLoading &&
            Native && Native.loadCategories) {
          requestCategories();
        }
        renderCurrentView(false);
        // Fuoco sul primo elemento VISIBILE della vista (focusableList è già
        // filtrata per rect>0): primo tasto della tastiera (search) o primo
        // chip genere (categories) — mai la sidebar e mai elementi hidden
        // (es. il tasto Clear con query vuota).
        const firstInView = focusableList.find(el => el.closest('#view-container'));
        if (firstInView) setTVFocus(firstInView);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      // M2: il boot copre le righe di home/tv/movie; "new" renderizza subito
      // dai top10Rank già in CATALOG (sliders top10 del boot) e in background
      // chiede comunque un refresh. Tab senza righe → spinner finché
      // l'evento catalog non sostituisce la vista (fix TV #12).
      const rowsKey = tabId === 'movies' ? 'movie' : tabId;
      const hasRows = Array.isArray(state.rows[rowsKey]) && state.rows[rowsKey].length > 0;
      if (Native && Native.loadTab && (tabId === 'new' || !hasRows)) {
        Native.loadTab(rowsKey);
      }
      if (!hasRows && tabId !== 'new') {
        showViewLoading();
        return;
      }
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /**
     * 7. CONTENT ROWS & CARD RENDERERS
     */
    function renderTop10SVG(rank) {
      return `
        <svg viewBox="0 0 110 150" class="w-16 sm:w-24 h-28 sm:h-40 shrink-0 -mr-3 sm:-mr-4 z-0 select-none">
          <text x="52" y="132" text-anchor="middle"
            font-family="Bebas Neue, Impact, sans-serif"
            font-size="${rank === 10 ? '125' : '152'}"
            font-weight="900"
            fill="#0E0E10"
            stroke="#52525B"
            stroke-width="4"
            letter-spacing="-6">${rank}</text>
        </svg>
      `;
    }

    function renderPosterCard(item, options = {}) {
      const inList = state.myList.includes(item.id);
      const prog = state.watchProgress[item.id];
      const showProgress = options.showProgress && prog;
      const topRank = options.topRank;

      return `
        <div class="flex items-end shrink-0 group">
          ${topRank ? renderTop10SVG(topRank) : ''}
          <div tabindex="0"
            onclick="openDetailModal('${item.id}')"
            onkeydown="if(event.key==='Enter') openDetailModal('${item.id}')"
            class="tv-focusable relative z-10 w-36 sm:w-44 md:w-48 aspect-[2/3] rounded-xl overflow-hidden bg-sctv-card cursor-pointer border border-white/10 shadow-xl">

            ${item.posterUrl
              ? `<img src="${item.posterUrl}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />`
              : `<div class="w-full h-full bg-zinc-900 flex items-center justify-center p-4 text-center font-display text-2xl text-zinc-300">${item.title}</div>`
            }

            <div class="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between pointer-events-none">
              ${item.isOriginal ? `<span class="px-1.5 py-0.5 rounded bg-black/80 backdrop-blur-sm font-display text-[#E50914] text-sm tracking-wider shadow">SC</span>` : '<span></span>'}
              ${item.top10Rank ? `<span class="bg-[#E50914] text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded uppercase tracking-wider shadow">TOP 10</span>` : ''}
            </div>

            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-0 group-hover:opacity-100 group-focus:opacity-100 transition-opacity duration-200 flex flex-col justify-end p-3">
              <div class="flex items-center gap-1.5 mb-2.5">
                <button onclick="event.stopPropagation(); startPlayback('${item.id}')"
                  class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:scale-110 transition shadow" title="Play">
                  <svg class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button onclick="event.stopPropagation(); toggleMyList('${item.id}')"
                  class="w-8 h-8 rounded-full bg-black/75 border border-white/40 text-white flex items-center justify-center hover:border-white transition" title="My List">
                  ${inList ? ICONS.check : ICONS.plus}
                </button>
                <button onclick="event.stopPropagation(); openDetailModal('${item.id}')"
                  class="ml-auto w-8 h-8 rounded-full bg-black/75 border border-white/40 text-white flex items-center justify-center hover:border-white transition" title="More Info">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
              </div>
              ${item.match ? `<div class="text-[11px] font-bold text-emerald-400">${item.match}% Match</div>` : ''}
              <div class="flex items-center gap-1.5 text-[10px] text-zinc-300 mt-0.5">
                ${item.maturity ? `<span class="border border-zinc-600 px-1 rounded">${item.maturity}</span>` : ''}
                ${item.durationLabel ? `<span>${item.durationLabel}</span>` : ''}
              </div>
            </div>

            ${showProgress ? `
              <div class="absolute bottom-0 inset-x-0 bg-black/85 backdrop-blur-sm px-2.5 py-1.5">
                <div class="text-[10px] text-zinc-300 font-medium mb-1 truncate">${prog.label}</div>
                <div class="w-full h-1 bg-white/20 rounded-full overflow-hidden">
                  <div class="h-full bg-[#E50914]" style="width: ${Math.round(prog.progress * 100)}%"></div>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderCarouselRow(rowId, title, items, options = {}) {
      if (!items || items.length === 0) return '';
      return `
        <section class="mb-9 relative group/row">
          <div class="flex items-center justify-between px-6 sm:px-10 mb-3">
            <h2 class="text-lg sm:text-xl font-bold tracking-tight text-zinc-100 flex items-center gap-2.5">
              <span>${title}</span>
            </h2>
            <div class="hidden sm:flex items-center gap-1.5">
              <button onclick="scrollRow('${rowId}', -1)" class="w-8 h-8 rounded-lg bg-white/[0.07] hover:bg-white/[0.16] flex items-center justify-center text-zinc-300 transition" aria-label="Scroll left">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <button onclick="scrollRow('${rowId}', 1)" class="w-8 h-8 rounded-lg bg-white/[0.07] hover:bg-white/[0.16] flex items-center justify-center text-zinc-300 transition" aria-label="Scroll right">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
          </div>

          <div id="${rowId}" class="flex items-center gap-3.5 sm:gap-4 overflow-x-auto no-scrollbar px-6 sm:px-10 py-3 scroll-smooth">
            ${items.map((item, index) => renderPosterCard(item, {
              ...options,
              topRank: options.isTop10 ? index + 1 : null
            })).join('')}
          </div>
        </section>
      `;
    }

    function scrollRow(rowId, dir) {
      AudioEngine.playTick();
      const el = document.getElementById(rowId);
      if (el) el.scrollBy({ left: dir * 560, behavior: 'smooth' });
    }

    /** Righe dal bridge (boot.rows): {label, ids, isTop10}. La rail continue
     *  conserva SEMPRE l'id fisso row-continue per l'aggiornamento mirato. */
    function rowsForTab(filterType) {
      if (!state.rows) return [];
      if (filterType === 'all') return state.rows.home || [];
      if (filterType === 'tv') return state.rows.tv || [];
      if (filterType === 'movie') return state.rows.movie || [];
      return [];
    }

    function renderBridgeRow(row, idx) {
      const scopedIds = new Set(getScopedCatalog().map(i => i.id));
      const items = (row.ids || [])
        .map(id => CATALOG.find(c => c.id === id))
        .filter(i => i && scopedIds.has(i.id));
      if (!items.length) return '';
      const isContinue = /continua|continue/i.test(row.label || '');
      const rowId = isContinue ? 'row-continue' : 'row-bridge-' + idx;
      return renderCarouselRow(rowId, row.label, items, {
        showProgress: isContinue,
        isTop10: !!row.isTop10
      });
    }

    /** Allinea la riga "Continua a guardare" di state.rows.home alla lista
     *  CW corrente (dato PER-PROFILO): al cambio profilo, senza sync la home
     *  ri-renderizzerebbe la riga del profilo precedente (card senza
     *  progresso) o perderebbe la riga finché non si rientra in home.
     *  Solo dati (state.rows), niente DOM: il DOM lo tocca il render. */
    function syncContinueRow(cwList) {
      const rows = state.rows && state.rows.home;
      if (!Array.isArray(rows)) return;
      const idx = rows.findIndex(r => /continua|continue/i.test(r.label || ''));
      if (!cwList.length) {
        if (idx >= 0) rows.splice(idx, 1);
        return;
      }
      const ids = cwList.map(cw => cw.id);
      if (idx >= 0) rows[idx].ids = ids;
      else rows.unshift({ label: 'Continua a guardare', ids });
    }

    // Fix TV #13: aggiornamento MIRATO della rail "Continua a guardare" su
    // progressChanged — solo il contenuto dello scroller #row-continue,
    // MAI renderCurrentView integrale (il fuoco resta dove è).
    function renderContinueRail() {
      const items = getScopedCatalog().filter(i => state.watchProgress[i.id] && !i.comingSoon);
      const el = document.getElementById('row-continue');
      if (!el) {
        // Rail non renderizzata (boot senza CW: primo titolo guardato). Su
        // home si inserisce SOLO la section prima delle rail esistenti; gli
        // altri tab non hanno la rail — niente da fare.
        if (!items.length || state.activeTab !== 'home') return;
        const wrap = document.querySelector('#view-container > div.-mt-6');
        if (!wrap) return;
        const row = (state.rows.home || []).find(r => /continua|continue/i.test(r.label || ''));
        const html = renderCarouselRow(
          'row-continue', (row && row.label) || 'Continua a guardare', items,
          { showProgress: true }
        );
        if (!html) return;
        wrap.insertAdjacentHTML('afterbegin', html);
        refreshFocusableElements();
        return;
      }
      if (!items.length) {
        const section = el.closest('section');
        if (section) section.remove();
        return;
      }
      el.innerHTML = items.map(item => renderPosterCard(item, { showProgress: true })).join('');
      refreshFocusableElements();
    }

    /**
     * 8. VIEW RENDERERS
     */
    function renderEmptyCatalogState(title = 'No Titles Available', subtitle = 'Add media items to the catalog to start browsing.') {
      return `

              ${heroItem.durationLabel ? `<span class="text-zinc-300">${heroItem.durationLabel}</span>` : ''}

                <span>Play</span>

                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span>More Info</span>
              </button>

              <button onclick="toggleMyList('${heroItem.id}')"

                ${inList ? ICONS.check : ICONS.plus}

          ${heroItem.maturity ? `
            <div class="hidden sm:flex items-center gap-3 absolute right-0 bottom-20 z-10">
