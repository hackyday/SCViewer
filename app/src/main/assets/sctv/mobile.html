<script>
  'use strict';

  /* ================================================================
     0. ICONE
     ================================================================ */
  const ICONS = {
    volumeOn: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`,
    volumeOff: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`,
    edit: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
    check: `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
    plus: `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    thumbUp: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>`,
    thumbDown: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22h0a3.13 3.13 0 0 1-3-3.88Z"/></svg>`,
    heart: `<svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
    play: `<svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
    playBig: `<svg width="19" height="19" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
    info: `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
    film: `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>`,
    chevron: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>`,
  };

  const NAV_ICONS = {
    home: `<svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    new: `<svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
    search: `<svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
    mylist: `<svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    settings: `<svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>`
  };
  const BOTTOM_NAV_ITEMS = [
    { id: 'home', label: 'Home', icon: NAV_ICONS.home },
    { id: 'new', label: 'Novità', icon: NAV_ICONS.new },
    { id: 'search', label: 'Cerca', icon: NAV_ICONS.search },
    { id: 'mylist', label: 'La mia lista', icon: NAV_ICONS.mylist },
    { id: 'settings', label: 'Altro', icon: NAV_ICONS.settings }
  ];

  /* ================================================================
     1. MOTORE AUDIO PROCEDURALE (stesso schema e stessa chiave
        localStorage del TV: sctv.uiAudio)
     ================================================================ */
  const AudioEngine = (() => {
    let ctx = null;
    let enabled = true;
    function ensureCtx() {
      if (!ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) ctx = new AudioCtx();
      }
      if (ctx && ctx.state === 'suspended') ctx.resume();
    }
    function playTick(freq, duration) {
      if (!enabled) return;
      try {
        ensureCtx(); if (!ctx) return;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq || 540, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime((freq || 540) * 0.65, ctx.currentTime + (duration || 0.03));
        gain.gain.setValueAtTime(0.045, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (duration || 0.03));
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + (duration || 0.03));
      } catch (e) {}
    }
    function playSelect() { playTick(760, 0.05); }
    return {
      get enabled() { return enabled; },
      setEnabled(v) { enabled = v; try { localStorage.setItem('sctv.uiAudio', v ? '1' : '0'); } catch (e) {} },
      init() {
        try {
          const v = localStorage.getItem('sctv.uiAudio');
          if (v !== null) enabled = v === '1';
        } catch (e) {}
      },
      playTick, playSelect
    };
  })();

  /* ================================================================
     2. BRIDGE NATIVO (AndroidJs) — stesso contratto del TV index.html
     ================================================================ */
  const Native = window.AndroidJs || null;
  let reqCounter = 0;
  function nextReq() { reqCounter += 1; return reqCounter; }
  function nat(fn) {
    if (!Native || typeof Native[fn] !== 'function') return;
    try { Native[fn].apply(Native, Array.prototype.slice.call(arguments, 1)); } catch (e) { console.error('AndroidJs.' + fn, e); }
  }

  /* ================================================================
     3. STATO + PROFILI (chiavi localStorage CONDIVISE col TV)
     ================================================================ */
  const PROFILE_STORE_KEY = 'sctv.profiles';
  const PROFILE_CURRENT_KEY = 'sctv.currentProfileId';

  const AVATAR_PRESETS = [
    { id: 'crimson', bg: 'from-[#E50914] to-[#6B0409]', label: 'Rosso' },
    { id: 'cobalt', bg: 'from-blue-600 to-indigo-950', label: 'Blu' },
    { id: 'emerald', bg: 'from-emerald-500 to-teal-950', label: 'Verde' },
    { id: 'amber', bg: 'from-amber-400 via-orange-500 to-rose-600', label: 'Ambra' },
    { id: 'violet', bg: 'from-violet-600 to-fuchsia-950', label: 'Viola' },
  ];
  /* Le classi Tailwind salvate dal TV non hanno Tailwind qui: mappa a
     gradient CSS reali (stesse stringhe nel localStorage). */
  const AVATAR_BG_CSS = {
    'from-[#E50914] to-[#6B0409]': 'linear-gradient(135deg,#E50914,#6B0409)',
    'from-blue-600 to-indigo-950': 'linear-gradient(135deg,#2563eb,#1e1b4b)',
    'from-emerald-500 to-teal-950': 'linear-gradient(135deg,#10b981,#042f2e)',
    'from-amber-400 via-orange-500 to-rose-600': 'linear-gradient(135deg,#fbbf24,#f97316,#e11d48)',
    'from-violet-600 to-fuchsia-950': 'linear-gradient(135deg,#7c3aed,#4a044e)'
  };
  function avatarBgCss(bg) { return AVATAR_BG_CSS[bg] || AVATAR_BG_CSS['from-[#E50914] to-[#6B0409]']; }
  function avatarMark(name, isKids) {
    if (isKids) return 'KIDS';
    return (String(name || 'SC').trim().slice(0, 2) || 'SC').toUpperCase();
  }

  const state = {
    profiles: [],
    currentProfile: null,
    managingProfiles: false,
    editingProfileId: null,
    selectedPresetIdx: 0,
    kidsEditor: false,

    shellActive: false,
    activeTab: 'home',        // home | new | search | mylist | categories | settings
    quickFilter: 'all',       // all | tv | movie
    selectedCategoryGenreId: null,
    searchQuery: '',
    remoteResults: null,      // {query, ids}

    catalog: {},              // id "site-<n>" → item (upsert conservativo)
    rows: { home: [], tv: [], movie: [] },
    heroTitleId: null,
    top10: [],                // tab Novità
    genres: [],               // [{id,name}] dall'archivio
    categoriesLoaded: false,
    genreResults: {},         // genreId → [ids]

    myList: [],
    continueWatching: [],
    ratings: {},

    domainHost: '',
    bootReceived: false,
    detail: null,             // {titleId, item, season, episodes, loading, seasonLoading, req}
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function persistProfiles() { try { localStorage.setItem(PROFILE_STORE_KEY, JSON.stringify(state.profiles)); } catch (e) {} }
  function persistCurrentProfileId(id) { try { localStorage.setItem(PROFILE_CURRENT_KEY, id); } catch (e) {} }
  function loadProfiles() {
    try {
      const raw = localStorage.getItem(PROFILE_STORE_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length > 0) return arr;
      }
    } catch (e) {}
    return [{ id: 'p-default', name: 'Predefinito', avatarBg: AVATAR_PRESETS[0].bg, isKids: false }];
  }
  function currentProfileKey(base) {
    const id = state.currentProfile ? state.currentProfile.id : 'default';
    return base + '_' + String(id).replace(/[^A-Za-z0-9_\-]/g, '');
  }
  function loadProfileScopedState(profileId) {
    const safe = String(profileId || '').replace(/[^A-Za-z0-9_\-]/g, '');
    try {
      const r = localStorage.getItem('sctv.ratings_' + safe);
      state.ratings = r ? (JSON.parse(r) || {}) : {};
    } catch (e) { state.ratings = {}; }
  }
  function persistRatings() {
    try { localStorage.setItem(currentProfileKey('sctv.ratings'), JSON.stringify(state.ratings || {})); } catch (e) {}
  }

  /* ================================================================
     4. CATALOGO: upsert conservativo (mai un item più povero sopra
        uno più ricco — stessa regola del TV)
     ================================================================ */
  function upsertCatalog(items) {
    if (!Array.isArray(items)) return;
    for (const it of items) {
      if (!it || !it.id) continue;
      const cur = state.catalog[it.id];
      if (!cur) { state.catalog[it.id] = it; continue; }
      for (const k of Object.keys(it)) {
        if (k === 'episodes' || k === 'currentSeason') continue;
        const v = it[k]; const c = cur[k];
        const vEmpty = v == null || v === '' || (Array.isArray(v) && v.length === 0);
        const cEmpty = c == null || c === '' || (Array.isArray(c) && c.length === 0);
        if (!vEmpty && cEmpty) cur[k] = v;
      }
      if (it.top10Rank) cur.top10Rank = it.top10Rank;
      if (Array.isArray(it.episodes) && it.episodes.length > 0) cur.episodes = it.episodes;
      if (it.currentSeason) cur.currentSeason = it.currentSeason;
    }
  }

  /* Figli: quando il profilo è kids il pool si restringe ai titoli kids. */
  function isScoped(it) {
    if (state.currentProfile && state.currentProfile.isKids) return !!it.isKids;
    return true;
  }
  function scopedIds() {
    const out = [];
    for (const id of Object.keys(state.catalog)) if (isScoped(state.catalog[id])) out.push(id);
    return out;
  }
  function itemOf(id) { return state.catalog[id] || null; }
  function itemByTitleId(tid) {
    return state.catalog['site-' + tid] || null;
  }
  function cwForTitle(titleId) {
    return state.continueWatching.find(c => Number(c.titleId) === Number(titleId)) || null;
  }

  /* ================================================================
     5. EVENTI NATIVO → JS (unico entry __sctvReceive)
     ================================================================ */
  window.__sctvReceive = function (ev) {
    if (!ev || typeof ev !== 'object') return;
    const t = ev.t; const d = ev.d || {}; const req = ev.req || 0;
    try {
      switch (t) {
        case 'boot': handleBoot(d); break;
        case 'catalog': handleCatalog(d); break;
        case 'titleDetail': handleTitleDetail(d, req); break;
        case 'titleSeason': handleTitleSeason(d, req); break;
        case 'searchResults': handleSearchResults(d, req); break;
        case 'categories': handleCategories(d); break;
        case 'genreData': handleGenreData(d); break;
        case 'myListChanged': handleMyListChanged(d); break;
        case 'progressChanged': handleProgressChanged(d); break;
        case 'error': handleError(d); break;
        case 'domainChanged': handleDomainChanged(d); break;
        default: break;
      }
    } catch (e) { console.error('__sctvReceive', t, e); }
  };

  function handleBoot(d) {
    state.bootReceived = true;
    upsertCatalog(d.catalog);
    state.rows = d.rows || state.rows;
    state.heroTitleId = d.heroTitleId || state.heroTitleId;
    if (Array.isArray(d.myList)) state.myList = d.myList.slice();
    if (Array.isArray(d.myListItems)) upsertCatalog(d.myListItems);
    // CW: reset (mai voci di profili precedenti) + item minimi nel catalogo.
    state.continueWatching = Array.isArray(d.continueWatching) ? d.continueWatching.slice() : [];
    for (const c of state.continueWatching) {
      const id = c.id || ('site-' + c.titleId);
      if (!state.catalog[id]) {
        state.catalog[id] = {
          id: id, titleId: Number(c.titleId) || 0, title: c.name || '',
          type: c.type || 'movie', posterUrl: c.poster || '', backdropUrl: c.poster || '',
          synopsis: c.tag || '', url: c.url || '', isKids: false, seasons: 0, episodes: [],
          genres: [], badges: [], cast: []
        };
      }
    }
    state.domainHost = d.domainHost || state.domainHost;
    if (!state.currentProfile) {
      // Gate ancora aperto: il catalogo è pronto dietro la porta.
      setGateStatus(state.profiles.length ? 'Catalogo pronto — tocca un profilo' : '');
    } else if (state.shellActive) {
      renderCurrentView();
      updateTopbarAvatar();
    }
  }

  function handleCatalog(d) {
    const tab = d.tab;
    if (tab === 'new') {
      const arr = Array.isArray(d.top10) ? d.top10 : (Array.isArray(d.catalog) ? d.catalog : []);
      upsertCatalog(arr);
      state.top10 = arr.map(it => it.id).filter(id => isScoped(state.catalog[id]));
    } else if (tab === 'home' || tab === 'tv' || tab === 'movie') {
      upsertCatalog(d.catalog);
      state.rows[tab] = Array.isArray(d.rows) ? d.rows : [];
    }
    if (state.shellActive && isActiveTabForCatalog(tab)) renderCurrentView();
  }
  function isActiveTabForCatalog(tab) {
    if (tab === 'new') return state.activeTab === 'new';
    if (tab === 'home') return state.activeTab === 'home' && state.quickFilter === 'all';
    if (tab === 'tv') return state.activeTab === 'home' && state.quickFilter === 'tv';
    if (tab === 'movie') return state.activeTab === 'home' && state.quickFilter === 'movie';
    return false;
  }

  function handleTitleDetail(d, req) {
    const item = d.item;
    if (!item) return;
    upsertCatalog([item]);
    if (state.detail && state.detail.req === req) {
      state.detail.item = state.catalog[item.id] || item;
      state.detail.loading = false;
      state.detail.season = item.currentSeason || 1;
      state.detail.episodes = Array.isArray(item.episodes) ? item.episodes.slice() : [];
      renderDetailContent();
    }
  }

  function handleTitleSeason(d, req) {
    if (!state.detail || state.detail.req !== req) return;
    state.detail.season = d.season || state.detail.season;
    state.detail.episodes = Array.isArray(d.episodes) ? d.episodes : [];
    state.detail.seasonLoading = false;
    // Cache nel catalogo anche per il play diretto dal drawer.
    const item = state.detail.item;
    if (item && state.detail.season === (item.currentSeason || state.detail.season)) {
      item.episodes = state.detail.episodes;
    }
    renderDetailContent();
  }

  function handleSearchResults(d, req) {
    upsertCatalog(d.catalog);
    const arr = Array.isArray(d.catalog) ? d.catalog : [];
    state.remoteResults = {
      query: d.query || '',
      req: req,
      ids: arr.map(it => it.id).filter(id => isScoped(state.catalog[id]))
    };
    if (state.shellActive && state.activeTab === 'search') renderCurrentView();
  }

  function handleCategories(d) {
    state.genres = Array.isArray(d.genres) ? d.genres : [];
    upsertCatalog(d.catalog);
    state.categoriesLoaded = true;
    if (state.shellActive && state.activeTab === 'categories') renderCurrentView();
  }

  function handleGenreData(d) {
    upsertCatalog(d.catalog);
    const arr = Array.isArray(d.catalog) ? d.catalog : [];
    state.genreResults[d.genreId] = arr.map(it => it.id).filter(id => isScoped(state.catalog[id]));
    if (state.shellActive && state.activeTab === 'categories') renderCurrentView();
  }

  function handleMyListChanged(d) {
    if (Array.isArray(d.ids)) state.myList = d.ids.slice();
    if (Array.isArray(d.items)) upsertCatalog(d.items);
    if (state.shellActive) { renderCurrentView(); if (state.detail) renderDetailContent(); }
  }

  function handleProgressChanged(d) {
    state.continueWatching = Array.isArray(d.continueWatching) ? d.continueWatching.slice() : [];
    // Item minimi dei CW nel catalogo (dopo switch profilo il boot non riparte).
    for (const c of state.continueWatching) {
      const id = c.id || ('site-' + c.titleId);
      if (!state.catalog[id]) {
        state.catalog[id] = {
          id: id, titleId: Number(c.titleId) || 0, title: c.name || '',
          type: c.type || 'movie', posterUrl: c.poster || '', backdropUrl: c.poster || '',
          synopsis: c.tag || '', url: c.url || '', isKids: false, seasons: 0, episodes: [],
          genres: [], badges: [], cast: []
        };
      }
    }
    if (state.shellActive) renderCurrentView();
  }

  function handleError(d) {
    const msg = (d && d.message) || 'Errore';
    if (!state.bootReceived && !state.shellActive) {
      setGateStatus('');
      const vc = document.getElementById('view-container');
      vc.innerHTML = `<div class="error-card">
        <h2>Connessione non riuscita</h2>
        <p>${esc(msg)}</p>
        <button class="btn primary" style="min-width:160px" onclick="retryConnection()">Riprova</button>
      </div>`;
    } else {
      showToast(msg);
    }
  }
  function retryConnection() { AudioEngine.playSelect(); nat('retryConnection'); setGateStatus('Riconnessione…'); }

  function handleDomainChanged(d) {
    state.domainHost = d.host || state.domainHost;
    if (state.shellActive && state.activeTab === 'settings') renderCurrentView();
    showToast('Dominio aggiornato: ' + (d.host || ''));
  }

  /* ================================================================
     6. PROFILO: gate, editor, enter
     ================================================================ */
  function setGateStatus(s) { const el = document.getElementById('gate-status'); if (el) el.textContent = s || ''; }

  function renderProfilesGrid() {
    const grid = document.getElementById('profiles-grid');
    const heading = document.getElementById('profile-heading');
    const manageBtn = document.getElementById('manage-profiles-btn');
    const sub = document.getElementById('profile-subheading');

    if (state.profiles.length > 0) manageBtn.classList.remove('hidden');
    else { manageBtn.classList.add('hidden'); state.managingProfiles = false; }

    heading.textContent = state.managingProfiles ? 'Gestisci profili' : 'Chi sta guardando?';
    sub.textContent = state.managingProfiles ? 'Tocca un profilo per modificarlo' : 'Tocca un profilo per iniziare lo streaming';
    manageBtn.textContent = state.managingProfiles ? 'Fine' : 'Modifica';
    manageBtn.classList.toggle('solid', state.managingProfiles);

    let html = state.profiles.map(p => `
      <button class="profile-tile" onclick="handleProfileClick('${esc(p.id)}')">
        <div class="avatar" style="background:${avatarBgCss(p.avatarBg)}">
          <span class="mark ${p.isKids ? 'kids' : ''}">${esc(avatarMark(p.name, p.isKids))}</span>
          ${state.managingProfiles ? `
            <div style="position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;color:#fff">
              ${ICONS.edit}
            </div>` : ''}
        </div>
        <span class="name">${esc(p.name)}</span>
      </button>
    `).join('');

    if (state.profiles.length < 5) {
      html += `
        <button class="profile-tile add" onclick="openProfileEditor(null)">
          <div class="avatar">${ICONS.plus}</div>
          <span class="name">Aggiungi</span>
        </button>`;
    }
    grid.innerHTML = html;
  }

  function toggleManageProfiles() {
    AudioEngine.playSelect();
    state.managingProfiles = !state.managingProfiles;
    renderProfilesGrid();
  }

  function handleProfileClick(id) {
    const profile = state.profiles.find(p => p.id === id);
    if (!profile) return;
    if (state.managingProfiles) { AudioEngine.playSelect(); openProfileEditor(profile); return; }
    enterApp(profile);
  }

  function enterApp(profile) {
    AudioEngine.playSelect();
    const prevId = state.currentProfile ? state.currentProfile.id : null;
    state.currentProfile = profile;
    persistCurrentProfileId(profile.id);
    loadProfileScopedState(profile.id);
    nat('setActiveProfile', profile.id);

    const gate = document.getElementById('profile-screen');
    gate.classList.add('hidden');
    const shell = document.getElementById('app-shell');
    shell.classList.remove('hidden');
    state.shellActive = true;

    const pill = document.getElementById('kids-mode-pill');
    pill.classList.toggle('hidden', !profile.isKids);

    updateTopbarAvatar();
    updateTopFilterPills();
    renderBottomNav();
    renderCurrentView();
    scrollToTop();
    if (prevId && prevId !== profile.id) showToast('Profilo attivo: ' + profile.name);
    if (!state.bootReceived) {
      document.getElementById('view-container').innerHTML =
        `<div class="center-block"><div class="spinner"></div><p style="margin-top:14px">Caricamento catalogo…</p></div>`;
    }
  }

  function updateTopbarAvatar() {
    const av = document.getElementById('topbar-avatar');
    const p = state.currentProfile;
    if (!p) return;
    av.style.background = avatarBgCss(p.avatarBg);
    av.innerHTML = p.isKids ? '<span class="kids-mark">KIDS</span>' : esc(avatarMark(p.name, false));
  }

  function openProfileGate() {
    AudioEngine.playSelect();
    state.managingProfiles = false;
    renderProfilesGrid();
    const gate = document.getElementById('profile-screen');
    gate.classList.remove('hidden');
  }

  function openProfileEditor(profile) {
    state.editingProfileId = profile ? profile.id : null;
    state.kidsEditor = profile ? !!profile.isKids : false;
    document.getElementById('profile-editor-title').textContent = profile ? 'Modifica profilo' : 'Nuovo profilo';
    document.getElementById('profile-name-input').value = profile ? profile.name : '';
    const del = document.getElementById('delete-profile-btn');
    del.classList.toggle('hidden', !profile);
    const foundIdx = profile ? AVATAR_PRESETS.findIndex(a => a.bg === profile.avatarBg) : 0;
    state.selectedPresetIdx = foundIdx >= 0 ? foundIdx : 0;
    renderAvatarPresets();
    renderKidsSwitch();
    const modal = document.getElementById('profile-editor-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    modal.style.display = 'flex';
  }
  function renderAvatarPresets() {
    const c = document.getElementById('avatar-color-picker');
    c.innerHTML = AVATAR_PRESETS.map((p, i) => `
      <button type="button" onclick="selectAvatarPreset(${i})" style="background:${avatarBgCss(p.bg)}"
        class="${state.selectedPresetIdx === i ? 'sel' : ''}">${esc(p.label)}</button>
    `).join('');
  }
  function selectAvatarPreset(i) {
    AudioEngine.playTick(620, 0.03);
    state.selectedPresetIdx = i;
    renderAvatarPresets();
  }
  function renderKidsSwitch() {
    document.getElementById('kids-switch').classList.toggle('on', state.kidsEditor);
  }
  function flipKidsToggle() {
    state.kidsEditor = !state.kidsEditor;
    AudioEngine.playTick(540, 0.03);
    renderKidsSwitch();
  }
  function closeProfileEditor() {
    const modal = document.getElementById('profile-editor-modal');
    modal.classList.add('hidden');
    modal.style.display = '';
  }
  function saveProfileEditor() {
    const rawName = document.getElementById('profile-name-input').value.trim();
    if (!rawName) { showToast('Inserisci un nome per il profilo'); return; }
    const preset = AVATAR_PRESETS[state.selectedPresetIdx];
    if (state.editingProfileId) {
      const idx = state.profiles.findIndex(p => p.id === state.editingProfileId);
      if (idx >= 0) {
        state.profiles[idx] = Object.assign({}, state.profiles[idx], { name: rawName, avatarBg: preset.bg, isKids: state.kidsEditor });
        if (state.currentProfile && state.currentProfile.id === state.editingProfileId) {
          state.currentProfile = state.profiles[idx];
          persistCurrentProfileId(state.currentProfile.id);
          nat('setActiveProfile', state.currentProfile.id);
          updateTopbarAvatar();
          document.getElementById('kids-mode-pill').classList.toggle('hidden', !state.currentProfile.isKids);
        }
      }
      showToast('Profilo aggiornato');
    } else {
      state.profiles.push({ id: 'p-' + Date.now(), name: rawName, avatarBg: preset.bg, isKids: state.kidsEditor });
      showToast('Profilo "' + rawName + '" creato');
    }
    AudioEngine.playSelect();
    persistProfiles();
    closeProfileEditor();
    renderProfilesGrid();
  }
  function deleteEditingProfile() {
    if (!state.editingProfileId) return;
    const delId = state.editingProfileId;
    state.profiles = state.profiles.filter(p => p.id !== delId);
    if (state.currentProfile && state.currentProfile.id === delId) {
      state.currentProfile = state.profiles[0] || null;
      if (state.currentProfile) persistCurrentProfileId(state.currentProfile.id);
    }
    AudioEngine.playSelect();
    persistProfiles();
    closeProfileEditor();
    renderProfilesGrid();
    showToast('Profilo eliminato');
  }

  /* ================================================================
     7. NAVIGAZIONE (top pills + bottom nav)
     ================================================================ */
  function updateTopFilterPills() {
    const wrap = document.getElementById('top-filter-pills');
    const show = state.activeTab === 'home' || state.activeTab === 'categories';
    wrap.style.visibility = show ? 'visible' : 'hidden';
    document.getElementById('pill-tv').className =
      'fpill' + ((state.activeTab === 'home' && state.quickFilter === 'tv') ? ' active' : '');
    document.getElementById('pill-movie').className =
      'fpill' + ((state.activeTab === 'home' && state.quickFilter === 'movie') ? ' active' : '');
    document.getElementById('pill-categories').className =
      'fpill' + (state.activeTab === 'categories' ? ' active' : '');
  }

  function renderBottomNav() {
    const c = document.getElementById('bottom-nav-items');
    c.innerHTML = BOTTOM_NAV_ITEMS.map(item => {
      const active = state.activeTab === item.id || (item.id === 'home' && state.activeTab === 'categories');
      return `
        <button class="nav-item ${active ? 'active' : ''}" onclick="switchTab('${item.id}')">
          <span class="dot"></span>
          ${item.icon}
          <span>${esc(item.label)}</span>
        </button>`;
    }).join('');
  }

  function scrollRoot() { return document.getElementById('scroll-root'); }
  function scrollToTop() {
    const sr = scrollRoot();
    if (sr) sr.scrollTop = 0;
  }

  function switchTab(tabId) {
    AudioEngine.playSelect();
    state.activeTab = tabId;
    if (tabId !== 'home') state.quickFilter = 'all';
    if (tabId === 'new') nat('loadTab', 'new');
    if (tabId === 'categories' && !state.categoriesLoaded) nat('loadCategories', nextReq());
    updateTopFilterPills();
    renderBottomNav();
    renderCurrentView();
    scrollToTop();
  }

  function setQuickFilter(type) {
    AudioEngine.playSelect();
    if (state.activeTab === 'home' && state.quickFilter === type) state.quickFilter = 'all';
    else { state.activeTab = 'home'; state.quickFilter = type; }
    updateTopFilterPills();
    renderBottomNav();
    renderCurrentView();
    scrollToTop();
  }

  /* ================================================================
     8. RENDER VISTE
     ================================================================ */
  function renderCurrentView() {
    const c = document.getElementById('view-container');
    switch (state.activeTab) {
      case 'home': c.innerHTML = renderHomeView(); break;
      case 'new': c.innerHTML = renderNewView(); break;
      case 'search': c.innerHTML = renderSearchView(); afterRenderSearch(); break;
      case 'mylist': c.innerHTML = renderMyListView(); break;
      case 'categories': c.innerHTML = renderCategoriesView(); break;
      case 'settings': c.innerHTML = renderSettingsView(); break;
      default: c.innerHTML = '';
    }
  }

  function rowsForFilter() {
    if (state.quickFilter === 'tv') return Array.isArray(state.rows.tv) ? state.rows.tv : [];
    if (state.quickFilter === 'movie') return Array.isArray(state.rows.movie) ? state.rows.movie : [];
    return Array.isArray(state.rows.home) ? state.rows.home : [];
  }

  function renderHomeView() {
    if (!state.bootReceived && Object.keys(state.catalog).length === 0) {
      return `<div class="center-block"><div class="spinner"></div><p style="margin-top:14px">Caricamento catalogo…</p></div>`;
    }
    const rows = rowsForFilter().map(r => {
      const ids = (r.ids || []).filter(id => state.catalog[id] && isScoped(state.catalog[id]));
      return { label: r.label, ids: ids, isTop10: !!r.isTop10 };
    }).filter(r => r.ids.length > 0);

    // Hero: id del boot se è nel pool filtrato, altrimenti primo rail disponibile.
    let heroId = null;
    const allIds = rows.flatMap(r => r.ids);
    if (state.heroTitleId && state.catalog[state.heroTitleId] &&
        (state.quickFilter === 'all' || allIds.includes(state.heroTitleId)) &&
        isScoped(state.catalog[state.heroTitleId])) {
      heroId = state.heroTitleId;
    } else if (allIds.length > 0) {
      heroId = allIds[0];
    }

    return (heroId ? renderHero(state.catalog[heroId]) : '') +
      rows.map(r => renderRail(r.label, r.ids, { isTop10: r.isTop10, isCw: r.label === 'Continua a guardare' })).join('');
  }

  function renderHero(item) {
    if (!item) return '';
    const inList = state.myList.includes(item.id);
    const img = item.backdropUrl || item.posterUrl || '';
    const cw = cwForTitle(item.titleId);
    const genres = Array.isArray(item.genres) ? item.genres.slice(0, 3) : [];
    return `
      <section class="hero">
        ${img ? `<img class="bg" src="${esc(img)}" alt="" />` : ''}
        <div class="grad-top"></div><div class="grad-bottom"></div>
        <div class="inner">
          <div class="kicker">
            <span class="org">SCTV</span>
            <span class="kind">${item.type === 'tv' ? 'SERIE TV' : 'FILM'}</span>
            ${item.top10Rank ? `<span class="rank-badge">#${item.top10Rank} Oggi</span>` : ''}
          </div>
          <h1>${esc(item.title)}</h1>
          <div class="meta">
            ${item.match ? `<span class="match">${item.match}% Match</span>` : ''}
            ${item.year ? `<span>• ${esc(item.year)}</span>` : ''}
            ${item.maturity ? `<span class="maturity">${esc(item.maturity)}</span>` : ''}
            ${genres.map(g => `<span>• ${esc(g)}</span>`).join('')}
          </div>
          <div class="cta">
            <button class="btn-play" onclick="startPlayback(${Number(item.titleId) || 0}, ${cw ? cw.season || 1 : 1}, ${cw ? cw.episode || 1 : 1})">
              ${ICONS.playBig}<span>${cw ? 'Riprendi' : 'Riproduci'}</span>
            </button>
            <button class="btn-list ${inList ? 'in-list' : ''}" onclick="toggleMyListAction(${Number(item.titleId) || 0})">
              ${inList ? ICONS.check : ICONS.plus}<span>${inList ? 'In lista' : 'La mia lista'}</span>
            </button>
            <button class="btn-info" onclick="openDetail('${esc(item.id)}')" aria-label="Info">${ICONS.info}</button>
          </div>
        </div>
      </section>`;
  }

  function renderRail(label, ids, opts) {
    opts = opts || {};
    return `
      <section class="rail-section">
        <div class="rail-title"><h2>${esc(label)}</h2></div>
        <div class="rail no-scrollbar">
          ${ids.map((id, i) => renderPosterCard(id, {
            rank: opts.isTop10 ? i + 1 : null,
            cw: opts.isCw ? cwForTitle(state.catalog[id] && state.catalog[id].titleId) : null
          })).join('')}
        </div>
      </section>`;
  }

  function renderPosterCard(id, opts) {
    opts = opts || {};
    const it = state.catalog[id];
    if (!it) return '';
    const cw = opts.cw || null;
    const prog = cw && cw.durationSec > 0 ? Math.round((cw.progress || 0) * 100) : 0;
    return `
      <div class="poster-wrap">
        ${opts.rank ? `<div class="rank-num">${opts.rank}</div>` : ''}
        <div class="poster" onclick="openDetail('${esc(id)}')">
          ${it.posterUrl
            ? `<img src="${esc(it.posterUrl)}" alt="" loading="lazy" />`
            : `<div class="fallback">${esc(it.title)}</div>`}
          <div class="badges-top">
            ${it.isOriginal ? `<span class="org">SC</span>` : '<span></span>'}
            ${it.top10Rank && !opts.rank ? `<span class="top10">TOP 10</span>` : ''}
          </div>
          ${cw ? `
            <div class="cw-overlay">
              <div class="lbl">${esc(cw.label || '')}</div>
              <div class="bar"><i style="width:${prog}%"></i></div>
            </div>` : ''}
        </div>
      </div>`;
  }

  function renderNewView() {
    if (state.top10.length === 0) {
      return `<div class="center-block"><div class="spinner"></div><p style="margin-top:14px">Caricamento Top 10…</p></div>`;
    }
    return `
      <div class="page">
        <h1 class="page-title">Novità e popolari</h1>
        <div class="section-label">I più visti su SCtv</div>
        <div class="grid3" style="padding-bottom:8px">
          ${state.top10.map(id => renderPosterCard(id, {})).join('')}
        </div>
      </div>`;
  }

  function renderMyListView() {
    const saved = state.myList.filter(id => state.catalog[id] && isScoped(state.catalog[id]));
    const pName = state.currentProfile ? state.currentProfile.name : '';
    return `
      <div class="page">
        <h1 class="page-title">La mia lista</h1>
        <p class="page-sub">${saved.length} ${saved.length === 1 ? 'titolo salvato' : 'titoli salvati'} per ${esc(pName)}</p>
        ${saved.length === 0 ? `
          <div class="empty-card">
            <div class="ico">${ICONS.plus}</div>
            <h2>La tua lista è vuota</h2>
            <p>Salva film e serie TV da guardare quando vuoi toccando "+ La mia lista" su qualsiasi titolo.</p>
            <button class="btn primary" onclick="switchTab('home')">Esplora il catalogo</button>
          </div>` : `
          <div class="grid3" style="padding-bottom:8px">
            ${saved.map(id => renderPosterCard(id, {})).join('')}
          </div>`}
      </div>`;
  }

  function renderCategoriesView() {
    if (!state.categoriesLoaded) {
      return `<div class="center-block"><div class="spinner"></div><p style="margin-top:14px">Caricamento categorie…</p></div>`;
    }
    const gid = state.selectedCategoryGenreId;
    let ids;
    if (gid) ids = (state.genreResults[gid] || []);
    else ids = scopedIds().slice(0, 60);
    return `
      <div class="page">
        <h1 class="page-title">Categorie</h1>
        <div class="chips no-scrollbar">
          <button class="chip ${!gid ? 'active' : ''}" onclick="selectGenre(null)">Tutti</button>
          ${state.genres.map(g => `
            <button class="chip ${gid === g.id ? 'active' : ''}" onclick="selectGenre(${Number(g.id)})">${esc(g.name)}</button>
          `).join('')}
        </div>
        ${ids.length === 0
          ? `<div class="center-block">Nessun titolo per questa categoria</div>`
          : `<div class="grid3" style="padding-bottom:8px">${ids.map(id => renderPosterCard(id, {})).join('')}</div>`}
      </div>`;
  }
  function selectGenre(gid) {
    AudioEngine.playSelect();
    state.selectedCategoryGenreId = gid;
    if (gid) nat('loadGenre', Number(gid), nextReq());
    renderCurrentView();
  }

  let searchDebounce = null;
  function searchGenres() {
    const genres = {};
    for (const id of Object.keys(state.catalog)) {
      const it = state.catalog[id];
      if (!isScoped(it) || !Array.isArray(it.genres)) continue;
      for (const g of it.genres) if (g) genres[g] = true;
    }
    return Object.keys(genres).slice(0, 8);
  }
  function renderSearchView() {
    const q = state.searchQuery.trim().toLowerCase();
    const chips = searchGenres();
    return `
      <div class="page">
        <div class="search-row">
          <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="mobile-search-input" type="search" value="${esc(state.searchQuery)}"
            placeholder="Cerca titoli, generi o attori..." autocomplete="off" oninput="onSearchInput(this.value)" />
          ${state.searchQuery ? `<button class="search-clear" onclick="clearSearchQuery()">✕</button>` : ''}
        </div>
        <div class="chips no-scrollbar">
          ${chips.map(c => `
            <button class="chip ${q === c.toLowerCase() ? 'active' : ''}" onclick="applySearchChip('${esc(c)}')">${esc(c)}</button>
          `).join('')}
        </div>
        <div id="search-results">${renderSearchResults()}</div>
      </div>`;
  }
  function renderSearchResults() {
    const q = state.searchQuery.trim();
    const rr = state.remoteResults;
    const results = (rr && rr.query === state.searchQuery) ? rr.ids : null;
    if (!q) {
      return `<div class="result-count">Esplora il catalogo</div>
        <div class="grid3">${scopedIds().slice(0, 18).map(id => renderPosterCard(id, {})).join('')}</div>`;
    }
    if (!results) {
      return `<div class="result-count">Ricerca in corso…</div>
        <div class="center-block"><div class="spinner"></div></div>`;
    }
    if (results.length === 0) {
      return `<div class="result-count">Risultati per "${esc(state.searchQuery)}" (0)</div>
        <div class="empty-card">
          <h2>Nessun risultato per "${esc(state.searchQuery)}"</h2>
          <p>Prova con un altro titolo, genere o nome del cast.</p>
        </div>`;
    }
    return `<div class="result-count">Risultati per "${esc(state.searchQuery)}" (${results.length})</div>
      <div class="grid3">${results.map(id => renderPosterCard(id, {})).join('')}</div>`;
  }
  function updateSearchResults() {
    const box = document.getElementById('search-results');
    if (box) box.innerHTML = renderSearchResults();
    const row = document.querySelector('.search-row');
    if (row && state.searchQuery && !row.querySelector('.search-clear')) row.insertAdjacentHTML('beforeend', `<button class="search-clear" onclick="clearSearchQuery()">✕</button>`);
  }
  /* Il view NON si re-renderizza per tasto: ricreare l'input a ogni evento
     romperebbe la composizione IME di Android. Solo la regione risultati. */
  function afterRenderSearch() {
    const inp = document.getElementById('mobile-search-input');
    if (inp && state.searchQuery) {
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  }
  function onSearchInput(v) {
    state.searchQuery = v;
    if (searchDebounce) clearTimeout(searchDebounce);
    const q = v.trim();
    if (q.length >= 2) {
      searchDebounce = setTimeout(() => { nat('search', q, nextReq()); }, 420);
    } else if (q.length === 0) {
      state.remoteResults = null;
    }
    updateSearchResults();
  }
  function clearSearchQuery() {
    AudioEngine.playSelect();
    state.searchQuery = '';
    state.remoteResults = null;
    if (searchDebounce) clearTimeout(searchDebounce);
    renderCurrentView();
    const inp = document.getElementById('mobile-search-input');
    if (inp) inp.focus();
  }
  function applySearchChip(term) {
    AudioEngine.playTick(620, 0.03);
    state.searchQuery = (state.searchQuery.toLowerCase() === term.toLowerCase()) ? '' : term;
    state.remoteResults = null;
    if (searchDebounce) clearTimeout(searchDebounce);
    if (state.searchQuery) nat('search', state.searchQuery, nextReq());
    renderCurrentView();
    afterRenderSearch();
  }

  function renderSettingsView() {
    const p = state.currentProfile || {};
    const online = navigator.onLine;
    const count = Object.keys(state.catalog).length;
    return `
      <div class="page">
        <h1 class="page-title">Altro e Impostazioni</h1>
        <p class="page-sub">Gestisci profilo attivo, audio interfaccia e rete.</p>

        <div class="set-card">
          <div class="set-row">
            <div style="display:flex;align-items:center;gap:14px;min-width:0">
              <div class="avatar-sm" style="background:${avatarBgCss(p.avatarBg)}">${esc(avatarMark(p.name, p.isKids))}</div>
              <div style="min-width:0">
                <div class="t1" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name || '')}</div>
                <div class="t2">${p.isKids ? 'Profilo Kids (Famiglia)' : 'Profilo Standard'}</div>
              </div>
            </div>
            <button class="side" onclick="openProfileGate()">Cambia</button>
          </div>
        </div>

        <div class="set-card">
          <button class="set-row" onclick="switchTab('categories')">
            <div>
              <div class="t1">Sfoglia per Categoria</div>
              <div class="t2">Filtra serie TV e film per genere</div>
            </div>
            <span class="chev">${ICONS.chevron}</span>
          </button>
          <div class="set-row">
            <div>
              <div class="t1">Audio interfaccia</div>
              <div class="t2">Suoni touch dell'app</div>
            </div>
            <button class="side ${AudioEngine.enabled ? '' : 'accent'}" onclick="toggleSound(); renderCurrentView();">
              ${AudioEngine.enabled ? 'Attivo' : 'Muto'}
            </button>
          </div>
          <button class="set-row" onclick="openNativeSettings()">
            <div>
              <div class="t1">Impostazioni SCtv</div>
              <div class="t2">Qualità massima, modalità interfaccia</div>
            </div>
            <span class="chev">${ICONS.chevron}</span>
          </button>
          <button class="set-row" onclick="openSiteInterface()">
            <div>
              <div class="t1">Interfaccia sito</div>
              <div class="t2">Apri il browsing diretto del sito</div>
            </div>
            <span class="chev">${ICONS.chevron}</span>
          </button>
        </div>

        <div class="set-card">
          <div class="set-row" onclick="checkConnectionStatus()">
            <div>
              <div class="t1">Stato Rete</div>
              <div class="t2">Connettività dispositivo</div>
            </div>
            <button class="side accent">Aggiorna</button>
          </div>
          <div style="padding:0 16px 16px">
            <div class="net-chip">
              <span>Stato: <strong class="${online ? 'on' : 'off'}" id="network-status-label">${online ? 'Online' : 'Offline'}</strong></span>
              <span class="mono">${count} titoli</span>
            </div>
            ${state.domainHost ? `
            <div class="net-chip" style="margin-top:8px">
              <span>Dominio</span>
              <span class="mono">${esc(state.domainHost)}</span>
            </div>` : ''}
          </div>
        </div>
      </div>`;
  }
  function checkConnectionStatus() {
    AudioEngine.playSelect();
    const online = navigator.onLine;
    const lbl = document.getElementById('network-status-label');
    if (lbl) {
      lbl.textContent = online ? 'Online' : 'Offline';
      lbl.className = online ? 'on' : 'off';
    }
    showToast(online ? 'Dispositivo connesso' : 'Dispositivo offline');
  }
  function openNativeSettings() { AudioEngine.playSelect(); nat('openSettings'); }
  function openSiteInterface() { AudioEngine.playSelect(); nat('openSiteInterface'); }

  /* ================================================================
     9. MY LIST + VALUTAZIONI
     ================================================================ */
  function toggleMyListAction(titleId) {
    const tid = Number(titleId);
    if (!tid) return;
    AudioEngine.playSelect();
    const id = 'site-' + tid;
    const item = itemByTitleId(tid);
    const wasIn = state.myList.includes(id);
    // Ottimistico: myListChanged dal nativo fa da verità.
    if (wasIn) state.myList = state.myList.filter(x => x !== id);
    else state.myList.push(id);
    if (state.shellActive) { renderCurrentView(); if (state.detail && state.detail.item && state.detail.item.titleId === tid) renderDetailContent(); }
    showToast(wasIn ? ('Rimosso "' + (item ? item.title : '') + '" dalla lista')
                    : ('Aggiunto "' + (item ? item.title : '') + '" alla lista'));
    nat('toggleMyList', tid);
  }

  function setRating(titleId, val) {
    AudioEngine.playSelect();
    const tid = String(titleId);
    if (state.ratings[tid] === val) {
      delete state.ratings[tid];
      showToast('Valutazione rimossa');
    } else {
      state.ratings[tid] = val;
      showToast(val === 'down' ? 'Non fa per me' : val === 'up' ? 'Mi piace' : 'Adoro questo titolo');
    }
    persistRatings();
    if (state.detail) renderDetailContent();
  }

  /* ================================================================
     10. DETTAGLIO (bottom sheet) — dati dal bridge (titleDetail/titleSeason)
     ================================================================ */
  function openDetail(id) {
    const it = itemOf(id);
    if (!it) return;
    AudioEngine.playSelect();
    const titleId = Number(it.titleId) || 0;
    const req = nextReq();
    state.detail = {
      titleId: titleId,
      item: it,
      season: it.currentSeason || 1,
      episodes: Array.isArray(it.episodes) ? it.episodes.slice() : [],
      loading: titleId > 0,
      seasonLoading: false,
      req: req
    };
    renderDetailContent();
    const modal = document.getElementById('detail-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    modal.style.display = 'flex';
    document.getElementById('detail-sheet').scrollTop = 0;
    if (titleId > 0) nat('loadDetail', titleId, req);
  }

  function closeDetailModal() {
    state.detail = null;
    const modal = document.getElementById('detail-modal');
    modal.classList.add('hidden');
    modal.style.display = '';
  }

  function changeDetailSeason(sel) {
    const s = parseInt(sel, 10) || 1;
    if (!state.detail) return;
    AudioEngine.playTick(500, 0.03);
    state.detail.season = s;
    state.detail.seasonLoading = true;
    renderDetailContent();
    nat('loadDetailSeason', state.detail.titleId, s, state.detail.req);
  }

  function renderDetailContent() {
    const box = document.getElementById('detail-content');
    if (!state.detail) { box.innerHTML = ''; return; }
    const it = state.detail.item;
    const tid = Number(it.titleId) || 0;
    const inList = state.myList.includes(it.id);
    const rating = state.ratings[String(tid)];
    const cw = cwForTitle(tid);
    const img = it.backdropUrl || it.posterUrl || '';
    const badgeList = Array.isArray(it.badges) ? it.badges : [];

    // Skeleton mentre il dettaglio reale è in fetch.
    const loadingBlock = state.detail.loading ? `
      <div style="padding:16px 20px 24px">
        <div class="skel" style="height:16px;width:40%;margin-bottom:10px"></div>
        <div class="skel" style="height:34px;width:80%;margin-bottom:14px"></div>
        <div class="skel" style="height:12px;width:100%;margin-bottom:8px"></div>
        <div class="skel" style="height:12px;width:92%;margin-bottom:8px"></div>
        <div class="skel" style="height:12px;width:60%"></div>
      </div>` : '';

    const similar = scopedIds()
      .filter(x => x !== it.id && state.catalog[x] && Array.isArray(state.catalog[x].genres) &&
        (it.genres || []).some(g => state.catalog[x].genres.includes(g)))
      .slice(0, 6);

    const seasonsCount = Math.max(it.seasons || 0, (state.detail.episodes || []).length > 0 ? 1 : 0);
    const epSection = it.type === 'tv' && (state.detail.episodes || []).length > 0 ? `
      <hr class="detail-divider" />
      <div class="ep-head">
        <h3>Episodi</h3>
        ${seasonsCount > 1 ? `
          <select class="season-select" onchange="changeDetailSeason(this.value)">
            ${Array.from({ length: seasonsCount }, (_, i) => `
              <option value="${i + 1}" ${state.detail.season === i + 1 ? 'selected' : ''}>Stagione ${i + 1}</option>
            `).join('')}
          </select>` : `<span style="font-size:12px;color:var(--muted);font-weight:700">Stagione ${state.detail.season}</span>`}
      </div>
      ${state.detail.seasonLoading ? `<div style="padding:26px 0"><div class="spinner"></div></div>` :
        state.detail.episodes.map(ep => `
          <button class="ep-row" onclick="startPlayback(${tid}, ${Number(ep.season) || state.detail.season}, ${Number(ep.ep) || 1})">
            <div class="top">
              <div class="ep-thumb">
                ${ep.thumb || it.backdropUrl || it.posterUrl ? `<img src="${esc(ep.thumb || it.backdropUrl || it.posterUrl)}" alt="" loading="lazy" />` : ''}
                <div class="mini-play"><i>${ICONS.play}</i></div>
              </div>
              <div style="flex:1;min-width:0">
                <div class="t">${Number(ep.ep)} • ${esc(ep.title)}</div>
                <div class="d">${esc(ep.duration || '')}</div>
              </div>
            </div>
            ${ep.desc ? `<div class="desc">${esc(ep.desc)}</div>` : ''}
          </button>
        `).join('')}` : '';

    box.innerHTML = `
      <div class="detail-hero">
        ${img ? `<img src="${esc(img)}" alt="" />` : '<div style="width:100%;height:100%;background:#0C0C0E"></div>'}
        <div class="grad"></div>
      </div>
      <div class="detail-body">
        <div class="detail-kicker">
          <span class="org">SCTV</span>
          <span class="kind">${it.type === 'tv' ? 'SERIE TV' : 'FILM'}</span>
        </div>
        <h2>${esc(it.title)}</h2>
        <div class="detail-meta">
          ${it.match ? `<span class="match">${it.match}% Match</span>` : ''}
          ${it.year ? `<span>${esc(it.year)}</span>` : ''}
          ${it.maturity ? `<span class="maturity">${esc(it.maturity)}</span>` : ''}
          ${it.durationLabel ? `<span>${esc(it.durationLabel)}</span>` : ''}
          ${badgeList.map(b => `<span class="badge">${esc(b)}</span>`).join('')}
        </div>
        <button class="btn-watch" onclick="startPlayback(${tid}, ${cw ? cw.season || 1 : 1}, ${cw ? cw.episode || 1 : 1})">
          ${ICONS.playBig}
          <span>${cw ? 'Riprendi' : 'Riproduci'}</span>
          ${cw ? `<span class="resume-tag">${esc(cw.label || '')}</span>` : ''}
        </button>
        <div class="detail-actions">
          <button class="btn-sec ${inList ? 'in-list' : ''}" onclick="toggleMyListAction(${tid})">
            ${inList ? ICONS.check : ICONS.plus}
            <span>${inList ? 'Nella mia lista' : 'La mia lista'}</span>
          </button>
          <div class="rate-row">
            <button class="${rating === 'down' ? 'sel' : ''}" aria-label="Non fa per me" onclick="setRating(${tid},'down')">${ICONS.thumbDown}</button>
            <button class="${rating === 'up' ? 'sel' : ''}" aria-label="Mi piace" onclick="setRating(${tid},'up')">${ICONS.thumbUp}</button>
            <button class="${rating === 'love' ? 'sel love' : ''}" aria-label="Adoro" onclick="setRating(${tid},'love')">${ICONS.heart}</button>
          </div>
        </div>
        ${loadingBlock || `
          <p class="detail-synopsis">${esc(it.synopsis || '')}</p>
          <div class="detail-facts">
            ${Array.isArray(it.cast) && it.cast.length ? `<div><b>Cast:</b> ${esc(it.cast.join(', '))}</div>` : ''}
            ${Array.isArray(it.genres) && it.genres.length ? `<div><b>Generi:</b> ${esc(it.genres.join(', '))}</div>` : ''}
            ${it.creator ? `<div><b>Creato da:</b> ${esc(it.creator)}</div>` : ''}
          </div>`}
        ${epSection}
        ${similar.length > 0 ? `
          <hr class="detail-divider" />
          <h3 class="detail-section-title">Titoli simili</h3>
          <div class="grid3" style="padding:0">${similar.map(id => renderPosterCard(id, {})).join('')}</div>` : ''}
      </div>`;
  }

  /* ================================================================
     11. PLAYBACK — il player è NATIVO (PlayerActivity, direct embed):
        AndroidJs.play apre a schermo intero con resume, progresso e
        "prossimo episodio" gestiti dal nativo.
     ================================================================ */
  function startPlayback(titleId, season, episode) {
    const tid = Number(titleId) || 0;
    if (!tid) { showToast('Titolo non disponibile'); return; }
    AudioEngine.playSelect();
    closeDetailModal();
    nat('play', tid, Math.max(1, Number(season) || 1), Math.max(1, Number(episode) || 1));
  }

  /* ================================================================
     12. TOAST / AUDIO TOGGLE / RETE
     ================================================================ */
  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('tv-toast');
    document.getElementById('tv-toast-msg').textContent = String(msg || '');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function syncAudioIcons() {
    const html = AudioEngine.enabled ? ICONS.volumeOn : ICONS.volumeOff;
    const i = document.getElementById('sound-icon-profile');
    const l = document.getElementById('sound-label-profile');
    if (i) i.innerHTML = html;
    if (l) l.textContent = AudioEngine.enabled ? 'Audio: On' : 'Audio: Off';
  }
  function toggleSound() {
    AudioEngine.setEnabled(!AudioEngine.enabled);
    if (AudioEngine.enabled) AudioEngine.playSelect();
    syncAudioIcons();
    showToast(AudioEngine.enabled ? 'Audio interfaccia attivo' : 'Audio interfaccia disattivato');
  }

  /* ================================================================
     13. TASTIERA: nascondi la bottom nav quando la IME è aperta
     ================================================================ */
  function watchKeyboard() {
    const vv = window.visualViewport;
    if (!vv) return;
    vv.addEventListener('resize', () => {
      const nav = document.getElementById('bottom-nav');
      if (!nav) return;
      const open = vv.height < window.innerHeight * 0.75;
      nav.classList.toggle('kbd-open', open);
    });
  }

  /* ================================================================
     14. BACK ANDROID (dispatchKeyEvent nativo → __sctvBackState)
     ================================================================ */
  window.__sctvBackState = function () {
    const modal = document.getElementById('profile-editor-modal');
    if (!modal.classList.contains('hidden')) { closeProfileEditor(); return 'stay'; }
    if (state.detail) { closeDetailModal(); return 'stay'; }
    const gate = document.getElementById('profile-screen');
    if (!gate.classList.contains('hidden') && state.shellActive) {
      gate.classList.add('hidden'); return 'stay';
    }
    if (!gate.classList.contains('hidden')) return 'exit';
    if (state.activeTab !== 'home') { switchTab('home'); return 'stay'; }
    if (state.quickFilter !== 'all') { state.quickFilter = 'all'; updateTopFilterPills(); renderCurrentView(); return 'stay'; }
    return 'exit';
  };

  /* D-pad: mai usato sul telefono — stub di compatibilità col nativo. */
  window.handleRemoteAction = function () {};

  /* ================================================================
     15. BOOT
     ================================================================ */
  window.addEventListener('load', function () {
    AudioEngine.init();
    syncAudioIcons();
    state.profiles = loadProfiles();
    renderProfilesGrid();
    watchKeyboard();

    // Profilo salvato AL NATIVO PRIMA del boot (stesso schema del TV):
    // il primo payload è già scoped al profilo giusto.
    let savedId = null;
    try { savedId = localStorage.getItem(PROFILE_CURRENT_KEY); } catch (e) {}
    if (savedId) {
      const saved = state.profiles.find(p => p.id === savedId);
      if (saved) {
        state.currentProfile = saved;
        loadProfileScopedState(saved.id);
        nat('setActiveProfile', saved.id);
      }
    }
    nat('bootReady');

    setTimeout(() => {
      const splash = document.getElementById('boot-splash');
      splash.classList.add('hidden');
      splash.style.opacity = '0';
      const gate = document.getElementById('profile-screen');
      gate.classList.remove('hidden');
      if (state.bootReceived) setGateStatus('Catalogo pronto');
      else setGateStatus('Caricamento catalogo…');
    }, 1250);
  });
</script>
</body>
</html>
