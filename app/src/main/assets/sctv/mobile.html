<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0E0E10" />
<title>SCtv</title>
<style>
  /* ============================================================
     SCtv MOBILE PORTRAIT — interfaccia touch (form factor telefono)
     Stesso contratto bridge dell'index.html TV (AndroidJs + __sctvReceive).
     Self-contained: nessun CDN, font locali assets/sctv/fonts/.
     ============================================================ */
  @font-face {
    font-family: 'Bebas Neue';
    src: url('fonts/bebas-neue-400.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('fonts/plus-jakarta-sans-var.woff2') format('woff2-variations');
    font-weight: 200 800;
    font-display: swap;
  }

  :root {
    --accent: #E50914;
    --accent-hi: #FF1E27;
    --bg: #0E0E10;
    --bg-deep: #070709;
    --card: #18181B;
    --card-hi: #161619;
    --surface: #222226;
    --text: #F4F4F5;
    --muted: #A1A1AA;
    --faint: #71717A;
    --line: rgba(255,255,255,0.10);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --topbar-h: 54px;
    --nav-h: 62px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* FIX SCROLL MIUI: lo scroll del DOCUMENTO è inaffidabile su alcune
     WebView (document scroll che resta bloccato). html/body non scorrono
     MAI: ogni scroll avviene dentro #scroll-root (e i vari sheet), che è
     un overflow container normale — affidabile su ogni WebView. */
  html, body {
    margin: 0; padding: 0;
    height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    overscroll-behavior-y: none;
    -webkit-text-size-adjust: 100%;
  }
  body { user-select: none; -webkit-user-select: none; }
  img { -webkit-user-drag: none; }
  input { user-select: text; -webkit-user-select: text; }
  .font-display { font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  button { font-family: inherit; border: none; background: none; color: inherit; padding: 0; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- BOOT SPLASH ---------- */
  #boot-splash {
    position: fixed; inset: 0; z-index: 100; background: #050507;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .5s ease;
  }
  .intro-logo { display: flex; align-items: baseline; gap: 2px; animation: sctvIntro 1.4s cubic-bezier(.16,1,.3,1) forwards; }
  .intro-logo .sc { font-family: 'Bebas Neue'; font-size: 64px; color: var(--accent); letter-spacing: 2px; text-shadow: 0 0 36px rgba(229,9,20,.6); }
  .intro-logo .tv { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: -1px; }
  .intro-line { width: 72px; height: 2px; margin-top: 10px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  @keyframes sctvIntro {
    0% { transform: scale(.86); opacity: 0; letter-spacing: 5px; }
    40% { transform: scale(1); opacity: 1; }
    85% { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1.16); opacity: 0; }
  }

  /* ---------- PROFILE GATE ---------- */
  #profile-screen {
    position: fixed; inset: 0; z-index: 60; background: var(--bg);
    display: flex; flex-direction: column;
    padding: calc(var(--sat) + 10px) 20px calc(var(--sab) + 14px);
    overflow-y: auto;
  }
  .gate-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .brand { display: flex; align-items: baseline; gap: 1px; }
  .brand .sc { font-family: 'Bebas Neue'; font-size: 28px; color: var(--accent); letter-spacing: 2px; line-height: 1; }
  .brand .tv { font-size: 19px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
  .gate-actions { display: flex; align-items: center; gap: 8px; }
  .pill-btn {
    height: 36px; padding: 0 14px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid var(--line);
    color: #D4D4D8; font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; transition: transform .15s;
  }
  .pill-btn:active { background: rgba(255,255,255,.16); transform: scale(.95); }
  .pill-btn.solid { background: #fff; color: #000; border-color: #fff; font-weight: 700; }
  .gate-center { margin: auto 0; padding: 28px 0; text-align: center; width: 100%; max-width: 380px; align-self: center; }
  .gate-center h1 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; margin: 0 0 6px; }
  .gate-center p { color: var(--muted); font-size: 12px; margin: 0 0 30px; }
  #profiles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; justify-items: center; }
  .profile-tile { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px; transition: transform .15s; }
  .profile-tile:active { transform: scale(.94); }
  .profile-tile .avatar {
    width: 104px; height: 104px; border-radius: 16px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.15);
  }
  .profile-tile .avatar .mark { font-family: 'Bebas Neue'; font-size: 40px; letter-spacing: 2px; color: #fff; }
  .profile-tile .avatar .mark.kids { font-size: 24px; }
  .profile-tile .name { color: #E4E4E7; font-weight: 600; font-size: 13px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile-tile.add .avatar { background: rgba(255,255,255,.04); border: 2px dashed #52525B; color: var(--muted); }
  .profile-tile.add .name { color: var(--muted); }
  #gate-status { text-align: center; font-size: 11px; color: var(--faint); min-height: 16px; margin-top: 14px; }
  .gate-foot { height: 12px; }

  /* ---------- PROFILE EDITOR (bottom sheet) ---------- */
  #profile-editor-modal {
    position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.85);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet-panel {
    background: var(--card); border: 1px solid rgba(255,255,255,.15); border-bottom: none;
    border-radius: 24px 24px 0 0; width: 100%; max-width: 440px;
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 24px 22px calc(var(--sab) + 20px); box-shadow: 0 -20px 60px rgba(0,0,0,.9);
    animation: sheetUp .28s cubic-bezier(.22,1,.36,1);
  }
  @keyframes sheetUp { from { transform: translateY(100%); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  .grabber { width: 40px; height: 5px; border-radius: 999px; background: #52525B; margin: 0 auto 18px; }
  .sheet-panel h2 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .sheet-panel .sub { color: var(--muted); font-size: 12px; margin: 0 0 20px; }
  .field-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .text-input {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font-size: 16px; font-weight: 500; color: #fff; outline: none;
    transition: border-color .2s;
  }
  .text-input:focus { border-color: var(--accent); }
  #avatar-color-picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  #avatar-color-picker button {
    height: 44px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    color: #fff; opacity: .65; transition: transform .15s, opacity .15s;
  }
  #avatar-color-picker button.sel { opacity: 1; transform: scale(1.06); outline: 2px solid #fff; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid rgba(255,255,255,.05);
    padding: 14px; border-radius: 12px; margin-top: 18px;
  }
  .toggle-row .t1 { font-weight: 600; font-size: 14px; }
  .toggle-row .t2 { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .switch { position: relative; width: 46px; height: 26px; border-radius: 999px; background: #3F3F46; transition: background .2s; flex-shrink: 0; }
  .switch.on { background: var(--accent); }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 999px; background: #fff; transition: transform .2s;
  }
  .switch.on::after { transform: translateX(20px); }
  .editor-actions { display: flex; gap: 10px; margin-top: 26px; }
  .btn {
    border-radius: 12px; font-size: 13px; font-weight: 600;
    padding: 14px 16px; transition: transform .15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); color: #fff; font-weight: 700; }
  .btn.primary:active { background: var(--accent-hi); }
  .btn.ghost { background: rgba(255,255,255,.08); }
  .btn.ghost:active { background: rgba(255,255,255,.16); }
  .btn.danger { background: rgba(69,10,10,.7); border: 1px solid rgba(153,27,27,.5); color: #F87171; font-weight: 700; text-transform: uppercase; font-size: 11px; }

  /* ---------- APP SHELL ---------- */
  #app-shell { position: absolute; inset: 0; background: var(--bg); overflow: hidden; }
  /* Contenitore scroll unico dell'app: sostituisce lo scroll del documento. */
  #scroll-root {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-top: calc(var(--sat) + var(--topbar-h) + 6px);
    padding-bottom: calc(var(--nav-h) + var(--sab) + 22px);
  }
  #top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    padding: calc(var(--sat) + 8px) 14px 10px;
    background: linear-gradient(180deg, rgba(14,14,16,.96) 0%, rgba(14,14,16,.82) 62%, rgba(14,14,16,0) 100%);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .top-brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .top-brand:active { transform: scale(.95); }
  .kids-pill { font-size: 10px; font-weight: 800; text-transform: uppercase; background: #FBBF24; color: #000; padding: 2px 8px; border-radius: 6px; }
  #top-filter-pills { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 2px 0; flex: 1; min-width: 0; }
  .fpill {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #E4E4E7;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    transition: transform .15s;
  }
  .fpill:active { transform: scale(.94); }
  .fpill.active { background: #fff; color: #000; border-color: #fff; font-weight: 700; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center; color: #fff;
    transition: transform .15s, background .15s;
  }
  .icon-btn:active { background: rgba(255,255,255,.18); transform: scale(.9); }
  #topbar-avatar {
    width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue'; font-size: 14px; letter-spacing: 1px; color: #fff;
    border: 1px solid rgba(255,255,255,.2); box-shadow: 0 4px 10px rgba(0,0,0,.4);
    transition: transform .15s;
  }
  #topbar-avatar:active { transform: scale(.9); }
  #topbar-avatar .kids-mark { font-size: 11px; }

  /* ---------- BOTTOM NAV ---------- */
  #bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: rgba(9,9,11,.97); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,.08);
    padding: 6px 2px calc(var(--sab) + 6px);
    transition: transform .25s ease;
  }
  #bottom-nav.kbd-open { transform: translateY(110%); }
  #bottom-nav-items { display: grid; grid-template-columns: repeat(5, 1fr); }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 5px 0; color: var(--faint); transition: transform .15s; position: relative;
  }
  .nav-item:active { transform: scale(.88); }
  .nav-item.active { color: #fff; }
  .nav-item .dot { position: absolute; top: -1px; width: 4px; height: 4px; border-radius: 999px; background: var(--accent); display: none; }
  .nav-item.active .dot { display: block; }
  .nav-item span { font-size: 10px; font-weight: 600; letter-spacing: -.2px; }
  .nav-item svg { width: 21px; height: 21px; }

  /* ---------- HERO BILLBOARD ---------- */
  .hero { position: relative; width: 100%; height: 68vh; min-height: 430px; max-height: 640px; overflow: hidden; margin-bottom: 18px; background: linear-gradient(180deg,#18181B,#0E0E10); }
  .hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .grad-top { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,14,16,.88) 0%, rgba(14,14,16,.35) 55%, rgba(14,14,16,0) 100%); pointer-events: none; }
  .hero .grad-bottom { position: absolute; inset: 0; background: linear-gradient(0deg, #0E0E10 0%, rgba(14,14,16,.96) 24%, rgba(14,14,16,.65) 54%, rgba(14,14,16,0) 100%); pointer-events: none; }
  .hero .inner { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center; padding: 0 20px calc(var(--sab) + 14px); }
  .hero .kicker { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
  .hero .kicker .org { font-family: 'Bebas Neue'; font-size: 17px; color: var(--accent); letter-spacing: 2px; }
  .hero .kicker .kind { font-size: 10px; text-transform: uppercase; letter-spacing: 4px; color: #D4D4D8; font-weight: 700; }
  .hero .kicker .rank-badge { background: var(--accent); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
  .hero h1 { font-family: 'Bebas Neue'; font-size: 46px; letter-spacing: 1px; line-height: .95; margin: 0 0 10px; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.6); max-width: 340px; }
  .hero .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-size: 11px; font-weight: 600; color: #D4D4D8; margin-bottom: 16px; }
  .hero .meta .match { color: #34D399; font-weight: 700; }
  .hero .meta .maturity { border: 1px solid #52525B; padding: 1px 5px; border-radius: 4px; font-size: 10px; }
  .hero .cta { width: 100%; max-width: 360px; display: grid; grid-template-columns: 6fr 4fr 44px; gap: 10px; }
  .btn-play {
    background: #fff; color: #000; font-weight: 800; font-size: 14px;
    padding: 13px 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: transform .15s;
  }
  .btn-play:active { background: #E4E4E7; transform: scale(.95); }
  .btn-list {
    background: rgba(255,255,255,.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.15); color: #fff; font-weight: 700; font-size: 12px;
    padding: 12px 8px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .15s;
  }
  .btn-list:active { background: rgba(255,255,255,.25); transform: scale(.95); }
  .btn-list.in-list { background: rgba(255,255,255,.28); }
  .btn-info {
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.15); color: #fff;
    border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: transform .15s;
  }
  .btn-info:active { background: rgba(255,255,255,.25); transform: scale(.95); }
  .btn svg { flex-shrink: 0; }

  /* ---------- RAILS & POSTERS ---------- */
  .rail-section { margin-bottom: 24px; }
  .rail-title { padding: 0 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .rail-title h2 { font-size: 16px; font-weight: 700; letter-spacing: -.3px; margin: 0; color: #F4F4F5; }
  .rail { display: flex; align-items: flex-end; gap: 10px; overflow-x: auto; padding: 2px 16px 6px; }
  .poster-wrap { flex-shrink: 0; display: flex; align-items: flex-end; }
  .rank-num {
    font-family: 'Bebas Neue'; font-size: 86px; line-height: .78; letter-spacing: -4px;
    color: var(--bg); -webkit-text-stroke: 4px #52525B; margin-right: -12px; z-index: 0; flex-shrink: 0;
  }
  .poster {
    position: relative; z-index: 1; width: 106px; aspect-ratio: 2/3; border-radius: 11px; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 16px rgba(0,0,0,.45);
    transition: transform .15s;
  }
  .poster:active { transform: scale(.94); }
  .grid3 .poster { width: 100%; z-index: auto; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .fallback {
    width: 100%; height: 100%; background: #18181B; display: flex; align-items: center; justify-content: center;
    padding: 10px; text-align: center; font-family: 'Bebas Neue'; font-size: 17px; line-height: 1.1; color: #D4D4D8;
  }
  .poster .badges-top { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .poster .badges-top .org { background: rgba(0,0,0,.8); backdrop-filter: blur(4px); font-family: 'Bebas Neue'; color: var(--accent); font-size: 12px; letter-spacing: 1px; padding: 1px 6px; border-radius: 4px; }
  .poster .badges-top .top10 { background: var(--accent); color: #fff; font-size: 8px; font-weight: 800; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; }
  .poster .cw-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.9); backdrop-filter: blur(4px); padding: 6px 8px; }
  .poster .cw-overlay .lbl { font-size: 9px; color: #D4D4D8; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
  .poster .cw-overlay .bar { width: 100%; height: 4px; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; }
  .poster .cw-overlay .bar i { display: block; height: 100%; background: var(--accent); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px; }

  /* ---------- PAGE HEADINGS ---------- */
  .page { padding-top: 4px; }
  .page-title { font-size: 24px; font-weight: 800; letter-spacing: -.6px; margin: 6px 16px 14px; }
  .page-sub { color: var(--muted); font-size: 12px; margin: -8px 16px 16px; }
  .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); margin: 4px 16px 12px; }

  /* ---------- CHIPS ---------- */
  .chips { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 2px 16px 14px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
    background: rgba(255,255,255,.08); color: #D4D4D8; transition: transform .15s; flex-shrink: 0;
  }
  .chip:active { background: rgba(255,255,255,.18); transform: scale(.94); }
  .chip.active { background: var(--accent); color: #fff; font-weight: 700; }

  /* ---------- SEARCH ---------- */
  .search-row {
    display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 12px 14px; margin: 4px 16px 16px;
  }
  .search-row svg { width: 20px; height: 20px; color: var(--muted); flex-shrink: 0; }
  .search-row input {
    flex: 1; background: transparent; border: none; outline: none; color: #fff;
    font-size: 16px; font-weight: 500; font-family: inherit; min-width: 0;
  }
  .search-row input::placeholder { color: var(--faint); }
  .search-clear { width: 24px; height: 24px; border-radius: 999px; background: rgba(255,255,255,.15); color: #E4E4E7; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .result-count { font-size: 13px; font-weight: 700; color: #D4D4D8; margin: 0 16px 12px; }

  /* ---------- DETAIL SHEET ---------- */
  #detail-modal {
    position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.8);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  #detail-modal .tap-out { flex: 1; }
  #detail-sheet {
    position: relative; background: var(--card-hi); border-top: 1px solid rgba(255,255,255,.15);
    border-radius: 24px 24px 0 0; width: 100%; max-height: 92vh; overflow-y: auto;
    box-shadow: 0 -20px 60px rgba(0,0,0,.95); padding-bottom: calc(var(--sab) + 16px);
    animation: sheetUp .28s cubic-bezier(.22,1,.36,1);
  }
  .sheet-head { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; background: linear-gradient(180deg, var(--card-hi) 40%, rgba(22,22,25,.9) 75%, transparent); pointer-events: none; }
  .sheet-head .grabber { margin: 0; }

<body>

  <!-- 1. BOOT SPLASH -->

  <!-- 6. TOAST -->
